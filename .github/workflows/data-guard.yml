# Safety net: the website's data lives in Cloudflare, never in this public repository.
# Apps still running the pre-Cloudflare version (with the old embedded GitHub token) could try to
# write hub-data.json here. If that happens, the commit is removed from main again right away.
name: Data guard

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: data-guard
  cancel-in-progress: false

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Remove data files pushed to main
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          PATTERN='(^|/)(hub-data|data)\.json$'
          BAD=$(git ls-files | grep -E "$PATTERN" || true)
          if [ -z "$BAD" ]; then echo "No data files."; exit 0; fi
          echo "::warning::Data file(s) pushed to main: $BAD"
          git config user.name "hosp-hub-data-guard"
          git config user.email "hosp-hub-data-guard@users.noreply.github.com"
          OTHER=""
          if git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            OTHER=$(git diff --name-only "$BEFORE" HEAD | grep -vE "$PATTERN" || true)
          fi
          if git cat-file -e "$BEFORE^{commit}" 2>/dev/null && [ -z "$OTHER" ] && [ -z "$(git ls-tree -r --name-only "$BEFORE" | grep -E "$PATTERN" || true)" ]; then
            # The push only added data: drop it from the branch history entirely.
            git push --force origin "$BEFORE:refs/heads/main"
            echo "Removed the data-only push from main."
          else
            git rm -q --cached $BAD
            git commit -q -m "Remove data file(s) pushed by an outdated app"
            git push origin HEAD:main
            echo "Deleted the data file(s) in a new commit."
          fi
