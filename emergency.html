<!DOCTYPE html>
<html lang="ar" dir="rtl" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>نظام خفارات الطوارئ والأقسام الخافرة | HOSP HUB</title>
    
    <!-- Google Fonts & Tailwind -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <!-- SheetJS for client-side Excel Import/Export -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        cairo: ['Cairo', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            50: '#fff1f2',
                            100: '#ffe4e6',
                            500: '#f43f5e',
                            600: '#e11d48',
                            700: '#be123c',
                            800: '#9f1239',
                            900: '#881337',
                        }
                    }
                }
            }
        }
    </script>
    
    <style>
        * { font-family: 'Cairo', sans-serif; }
        .glass-panel {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(226, 232, 240, 0.85);
        }
        .dark .glass-panel {
            background: rgba(15, 23, 42, 0.9);
            border: 1px solid rgba(51, 65, 85, 0.85);
        }
        .tab-btn {
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        @page {
            size: A4 portrait;
            margin: 4mm 5mm !important;
        }
        @media print {
            html, body { 
                background: white !important; 
                color: black !important; 
                padding: 0 !important; 
                margin: 0 !important; 
                font-size: 7.5pt !important;
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important;
            }
            .no-print, header, nav, #duty-dashboard-grid, #admin-settings-section, #tabs-nav-bar, #schedule-view-container, #doctor-picker-modal, #hospital-sync-modal, #export-resident-modal, #add-resident-modal, #hub-toast-container, #conflict-modal, #preferences-modal, #auto-schedule-prompt-modal { 
                display: none !important; 
            }
            #official-print-area { 
                display: block !important; 
                width: 100% !important; 
                margin: 0 !important; 
                padding: 0 !important; 
            }
            table { 
                page-break-inside: auto; 
                font-size: 7.5pt !important; 
                border-collapse: collapse !important; 
                width: 100% !important; 
            }
            tr { 
                page-break-inside: avoid; 
                page-break-after: auto; 
            }
            td, th { 
                padding: 1.5px 3px !important; 
                border: 1px solid black !important; 
                color: black !important; 
                line-height: 1.15 !important;
            }
        }
    </style>
</head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-800 dark:text-slate-100 min-h-full transition-colors duration-200">

    <!-- Top Navigation Header -->
    <header class="sticky top-0 z-40 glass-panel border-b border-slate-200/80 dark:border-slate-800 shadow-sm no-print">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between gap-2">
            
            <!-- Left Branding & Back to Main Platform -->
            <div class="flex items-center gap-3">
                <a href="./index.html" class="inline-flex items-center justify-center gap-2 px-3 py-1.5 rounded-xl text-xs font-bold text-slate-700 dark:text-slate-200 bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 transition">
                    <i class="fas fa-arrow-right"></i>
                    <span>الرئيسية</span>
                </a>
                <div class="h-6 w-px bg-slate-200 dark:bg-slate-700 hidden sm:block"></div>
                <div class="flex items-center gap-2.5">
                    <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-rose-600 to-red-500 flex items-center justify-center text-white shadow-md shadow-rose-500/20">
                        <i class="fas fa-truck-medical text-base"></i>
                    </div>
                    <div>
                        <h1 class="text-sm sm:text-base font-black tracking-tight flex items-center gap-1.5">
                            <span>نظام خفارات الطوارئ والأقسام</span>
                            <span class="text-[10px] bg-rose-100 text-rose-700 dark:bg-rose-950 dark:text-rose-300 px-2 py-0.5 rounded-full font-bold">EMERGENCY HUB</span>
                        </h1>
                        <p class="text-[10px] text-slate-500 hidden sm:block">إدارة وتوزيع خفارات المقيمين الأقدمين وإضراب الدوريين (RS)</p>
                    </div>
                </div>
            </div>

            <!-- Top Actions -->
            <div class="flex items-center gap-2">
                <!-- Rotators Strike State Toggle Button -->
                <button type="button" id="rs-toggle-btn" onclick="toggleRotatorsStrike()" class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-xl text-xs font-bold text-slate-700 dark:text-slate-200 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 hover:bg-slate-50 transition shadow-xs">
                    <i class="fas fa-bed-pulse text-amber-500"></i>
                    <span class="hidden md:inline">إضراب الدوريين (RS)</span>
                    <span id="rs-toggle-badge" class="text-[10px] bg-emerald-100 text-emerald-800 dark:bg-emerald-950 dark:text-emerald-300 px-2 py-0.5 rounded-full font-bold">مفعّل</span>
                </button>

                <button type="button" onclick="exportFullScheduleToExcel()" class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-xl text-xs font-bold text-slate-700 dark:text-slate-200 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 hover:bg-slate-50 shadow-sm transition">
                    <i class="fas fa-file-excel text-emerald-500"></i>
                    <span class="hidden md:inline">تصدير Excel</span>
                </button>
                <button type="button" onclick="prepareOfficialPrint()" class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-xl text-xs font-bold text-slate-700 dark:text-slate-200 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 hover:bg-slate-50 shadow-sm transition">
                    <i class="fas fa-print text-slate-500"></i>
                    <span class="hidden md:inline">طباعة رسمية</span>
                </button>
                <button type="button" onclick="toggleDarkMode()" class="w-9 h-9 rounded-xl flex items-center justify-center text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 transition">
                    <i class="fas fa-moon dark:hidden"></i>
                    <i class="fas fa-sun hidden dark:inline"></i>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-5 space-y-5">

        <!-- Administrative Order Bar & Meta Settings -->
        <section id="admin-settings-section" class="glass-panel rounded-2xl p-4 border border-slate-200/80 dark:border-slate-800 no-print">
            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-3 items-center">
                <!-- Hospital Selector with Match Button -->
                <div>
                    <div class="flex items-center justify-between mb-1">
                        <label class="block text-[11px] font-bold text-slate-500">المستشفى المحددة</label>
                        <button type="button" onclick="openHospitalSyncModal()" class="text-[10px] text-sky-600 hover:underline font-bold flex items-center gap-1">
                            <i class="fas fa-arrows-rotate text-[9px]"></i>
                            <span>مطابقة الأسماء</span>
                        </button>
                    </div>
                    <select id="meta-hosp-select" onchange="onHospitalChange(this.value)" class="w-full text-xs font-bold px-3 py-2 rounded-xl bg-slate-100 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 text-slate-800 dark:text-slate-100 focus:outline-none focus:ring-2 focus:ring-rose-500/20">
                        <option value="iraqi">المستشفى العراقي التعليمي (الصدر التعليمي)</option>
                        <option value="basra">مستشفى البصرة التعليمي</option>
                        <option value="mawani">مستشفى الموانئ التعليمي</option>
                    </select>
                </div>

                <!-- Month & Year Selector -->
                <div>
                    <label class="block text-[11px] font-bold text-slate-500 mb-1">شهر وسنة الجدول</label>
                    <div class="grid grid-cols-2 gap-1.5">
                        <select id="meta-month-select" onchange="onMonthYearChange(this.value, document.getElementById('meta-year-input').value)" class="w-full text-xs font-bold px-2 py-2 rounded-xl bg-slate-100 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 text-slate-800 dark:text-slate-100">
                            <option value="1">كانون 2 (1)</option>
                            <option value="2">شباط (2)</option>
                            <option value="3">آذار (3)</option>
                            <option value="4">نيسان (4)</option>
                            <option value="5">أيار (5)</option>
                            <option value="6">حزيران (6)</option>
                            <option value="7">تموز (7)</option>
                            <option value="8">آب (8)</option>
                            <option value="9" selected>أيلول (9)</option>
                            <option value="10">تشرين 1 (10)</option>
                            <option value="11">تشرين 2 (11)</option>
                            <option value="12">كانون 1 (12)</option>
                        </select>
                        <input type="number" id="meta-year-input" value="2026" min="2024" max="2035" onchange="onMonthYearChange(document.getElementById('meta-month-select').value, this.value)" class="w-full text-xs font-bold px-2 py-2 rounded-xl bg-slate-100 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 text-center font-mono">
                    </div>
                </div>

                <!-- Official Order Number with Sequential Suggestion -->
                <div>
                    <div class="flex items-center justify-between mb-1">
                        <label class="block text-[11px] font-bold text-slate-500">رقم الأمر الإداري</label>
                        <button type="button" onclick="suggestSequentialOrderNumber()" class="text-[10px] text-rose-600 hover:underline font-bold flex items-center gap-1" title="اقتراح رقم تسلسلي تلقائي">
                            <i class="fas fa-wand-magic-sparkles text-[9px]"></i>
                            <span>اقتراح متسلسل</span>
                        </button>
                    </div>
                    <div class="flex items-center gap-1.5">
                        <input type="text" id="meta-order-number" onchange="onOrderNumberChange(this.value)" class="w-full text-xs font-bold px-3 py-2 rounded-xl bg-slate-100 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 text-slate-800 dark:text-slate-100">
                    </div>
                </div>

                <!-- Reset / Tools -->
                <div class="flex items-center justify-end gap-2 pt-4 sm:pt-0">
                    <button type="button" onclick="resetEmergencyToDefaults()" class="w-full px-3 py-2 rounded-xl text-xs font-bold text-slate-600 dark:text-slate-300 bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 transition flex items-center justify-center gap-1.5" title="استعادة النسخة الأصلية">
                        <i class="fas fa-rotate-left"></i>
                        <span>استعادة الأصلية</span>
                    </button>
                </div>
            </div>

            <!-- Rotators Strike (RS) Date Range Bar (shown when RS is enabled) -->
            <div id="rs-settings-bar" class="mt-3 pt-3 border-t border-slate-200/80 dark:border-slate-800 flex items-center justify-between flex-wrap gap-3">
                <div class="flex items-center gap-2">
                    <span class="w-2 h-2 rounded-full bg-amber-500"></span>
                    <span class="text-xs font-black text-amber-700 dark:text-amber-300">
                        فترة إضراب المقيمين الدوريين (RS):
                    </span>
                </div>
                <div class="flex items-center gap-4 flex-wrap">
                    <div class="flex items-center gap-1.5">
                        <label class="text-[11px] font-bold text-slate-500">تاريخ البدء:</label>
                        <input type="date" id="meta-rs-start" onchange="onRsDateChange('rsStartDate', this.value)" class="text-xs font-bold px-2 py-1 rounded-xl bg-slate-100 dark:bg-slate-900 border border-slate-200 dark:border-slate-700">
                    </div>
                    <div class="flex items-center gap-1.5">
                        <label class="text-[11px] font-bold text-slate-500">تاريخ الانتهاء:</label>
                        <input type="date" id="meta-rs-end" onchange="onRsDateChange('rsEndDate', this.value)" class="text-xs font-bold px-2 py-1 rounded-xl bg-slate-100 dark:bg-slate-900 border border-slate-200 dark:border-slate-700">
                    </div>
                    <span class="text-[10px] text-slate-400">يبدأ الأمر الإداري للطباعة من تاريخ بداية الإضراب وحتى أحدث تاريخ مجدول</span>
                </div>
            </div>
        </section>

        <!-- Monthly Duty Counting Dashboard -->
        <section id="duty-dashboard-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-3 no-print">
            <!-- Dynamically populated by updateDutyDashboard() in emergency.js -->
        </section>

        <!-- Main Tabs Navigation Bar -->
        <section id="tabs-nav-bar" class="flex flex-wrap items-center gap-2 p-1.5 rounded-2xl bg-slate-200/70 dark:bg-slate-900 border border-slate-200 dark:border-slate-800 no-print">
            <button type="button" data-tab="er" onclick="switchTab('er')" class="tab-btn active-tab flex-1 sm:flex-none px-4 py-2 rounded-xl text-xs font-black flex items-center justify-center gap-2 bg-rose-600 text-white shadow-sm">
                <i class="fas fa-truck-medical"></i>
                <span>1. خفارات الطوارئ (ER)</span>
            </button>
            <button type="button" data-tab="con" onclick="switchTab('con')" class="tab-btn flex-1 sm:flex-none px-4 py-2 rounded-xl text-xs font-black flex items-center justify-center gap-2 text-slate-600 dark:text-slate-300 hover:text-slate-900 dark:hover:text-white">
                <i class="fas fa-stethoscope"></i>
                <span>2. الاستشارية الخافرة (Con)</span>
            </button>
            <button type="button" data-tab="dc" onclick="switchTab('dc')" class="tab-btn flex-1 sm:flex-none px-4 py-2 rounded-xl text-xs font-black flex items-center justify-center gap-2 text-slate-600 dark:text-slate-300 hover:text-slate-900 dark:hover:text-white">
                <i class="fas fa-file-medical"></i>
                <span>3. شهادات الوفاة (DC)</span>
            </button>
            
            <!-- Rotators Strike Tabs (Separate ER and Wards) -->
            <button type="button" id="tab-btn-rs-er" data-tab="rs_er" onclick="switchTab('rs_er')" class="tab-btn flex-1 sm:flex-none px-4 py-2 rounded-xl text-xs font-black flex items-center justify-center gap-2 text-amber-700 dark:text-amber-400 hover:text-amber-900">
                <i class="fas fa-truck-medical"></i>
                <span>4. إضراب طوارئ (RS - ER)</span>
            </button>
            <button type="button" id="tab-btn-rs-wards" data-tab="rs_wards" onclick="switchTab('rs_wards')" class="tab-btn flex-1 sm:flex-none px-4 py-2 rounded-xl text-xs font-black flex items-center justify-center gap-2 text-amber-700 dark:text-amber-400 hover:text-amber-900">
                <i class="fas fa-bed-pulse"></i>
                <span>5. إضراب ردهات (RS - Wards)</span>
            </button>

            <!-- Resident Database Tab -->
            <button type="button" data-tab="db" onclick="switchTab('db')" class="tab-btn flex-1 sm:flex-none px-4 py-2 rounded-xl text-xs font-black flex items-center justify-center gap-2 text-slate-600 dark:text-slate-300 hover:text-slate-900 dark:hover:text-white">
                <i class="fas fa-users-gear"></i>
                <span>6. قاعدة الأطباء والأنصبة (DB)</span>
            </button>
        </section>

        <!-- Dynamic Schedule Container -->
        <section id="schedule-view-container" class="glass-panel rounded-2xl border border-slate-200/80 dark:border-slate-800 p-4 sm:p-5 shadow-sm">
            <!-- Rendered dynamically by emergency.js -->
        </section>

        <!-- Dedicated Official Ministerial Printable Area (Active on Print) -->
        <section id="official-print-area" class="hidden print:block print-full">
            <!-- Rendered dynamically by prepareOfficialPrint() in emergency.js -->
        </section>

    </main>

    <!-- Doctor Picker Modal -->
    <div id="doctor-picker-modal" class="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm hidden flex items-center justify-center p-4 no-print">
        <div class="glass-panel rounded-3xl border border-slate-200 dark:border-slate-800 w-full max-w-lg overflow-hidden shadow-2xl animate-in fade-in zoom-in duration-150">
            <!-- Modal Header -->
            <div class="p-4 border-b border-slate-100 dark:border-slate-800 flex items-center justify-between">
                <div>
                    <h3 class="font-black text-sm text-slate-800 dark:text-slate-100">اختيار طبيب للخفارة</h3>
                    <p class="text-[11px] text-slate-500" id="picker-day-info">اليوم والوردية</p>
                </div>
                <button type="button" onclick="closeDoctorPickerModal()" class="w-8 h-8 rounded-full flex items-center justify-center text-slate-400 hover:text-slate-700 dark:hover:text-slate-200 hover:bg-slate-100 dark:hover:bg-slate-800 transition">
                    <i class="fas fa-times text-sm"></i>
                </button>
            </div>

            <!-- Modal Search & Filters -->
            <div class="p-4 border-b border-slate-100 dark:border-slate-800 space-y-2 bg-slate-50/50 dark:bg-slate-900/40">
                <div class="relative">
                    <i class="fas fa-search absolute right-3 top-3 text-slate-400 text-xs"></i>
                    <input type="text" id="picker-search-input" oninput="filterPickerList()" placeholder="بحث باسم الطبيب أو الاختصاص..." class="w-full pr-8 pl-3 py-2 rounded-xl text-xs bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-700 text-slate-800 dark:text-slate-100 focus:outline-none focus:ring-2 focus:ring-rose-500/30">
                </div>
                <div class="flex items-center justify-between gap-2">
                    <select id="picker-quota-filter" onchange="filterPickerList()" class="px-2.5 py-1.5 rounded-xl text-xs bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-700 text-slate-700 dark:text-slate-300">
                        <option value="all">كل الأطباء المتاحين</option>
                        <option value="pending_only" selected>من تبقى لهم خفارات بحسب النصاب</option>
                    </select>
                    <button type="button" onclick="clearActiveSlot()" class="px-3 py-1.5 rounded-xl text-xs font-bold text-rose-600 dark:text-rose-400 hover:bg-rose-50 dark:hover:bg-rose-950/40 transition">
                        <i class="fas fa-eraser ml-1"></i> إفراغ الخفارة
                    </button>
                </div>
            </div>

            <!-- Doctors Scroll List -->
            <div id="picker-doctors-list" class="p-3 max-h-[360px] overflow-y-auto space-y-1.5">
                <!-- Rendered dynamically by emergency.js -->
            </div>

            <!-- Modal Footer -->
            <div class="p-3 bg-slate-50 dark:bg-slate-900/60 border-t border-slate-100 dark:border-slate-800 flex justify-end">
                <button type="button" onclick="closeDoctorPickerModal()" class="px-4 py-2 rounded-xl text-xs font-bold text-slate-600 dark:text-slate-300 hover:bg-slate-200 dark:hover:bg-slate-800 transition">
                    إلغاء
                </button>
            </div>
        </div>
    </div>

    <!-- Scripts Integration -->
    <script src="./hub-core.js"></script>
    <script src="./emergency-data.js"></script>
    <script src="./emergency.js"></script>

    <script>
        // Dark Mode Toggle
        function toggleDarkMode() {
            document.documentElement.classList.toggle('dark');
            localStorage.setItem('hub-theme', document.documentElement.classList.contains('dark') ? 'dark' : 'light');
        }
        (function() {
            if (localStorage.getItem('hub-theme') === 'dark' || (!localStorage.getItem('hub-theme') && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                document.documentElement.classList.add('dark');
            } else {
                document.documentElement.classList.remove('dark');
            }
        })();
    </script>
</body>
</html>
