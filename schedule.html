<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <script src="./storage-scope.js"></script>
    <script src="./auth-guard.js"></script>
    <script src="./app-view.js"></script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>جدول الخفارات الشهري · Monthly Duty Schedule 🇮🇶</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700;800&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link rel="stylesheet" href="./nav-component.css" />
    <link rel="stylesheet" href="./hub-accounts.css" />

    <style>
        /*
         * Duty schedule, rebuilt for phones first.
         * Smooth scrolling on iPhone/iPad: the page scrolls on its own (no nested scrollers) except the
         * full table, which has ONE scroller with sticky header and day column; no blur, transforms or
         * transitions inside it, opaque sticky cells, and border-collapse: separate (sticky cells with
         * collapsed borders jitter in Safari).
         */
        :root {
            --sab: env(safe-area-inset-bottom, 0px);
            --s-bg: #F2F2F7;
            --s-card: #FFFFFF;
            --s-card2: #F2F2F7;
            --s-text: #000000;
            --s-text2: rgba(60, 60, 67, 0.62);
            --s-text3: rgba(60, 60, 67, 0.32);
            --s-sep: rgba(60, 60, 67, 0.16);
            --s-fill: rgba(118, 118, 128, 0.12);
            --s-tint: #007AFF;
            --s-tint-soft: rgba(0, 122, 255, 0.12);
            --s-gold: #B7791F;
            --s-gold-soft: rgba(214, 158, 46, 0.16);
            --s-fri: #D92D20;
            --s-fri-soft: rgba(217, 45, 32, 0.07);
            --s-sat: #C2410C;
            --s-sat-soft: rgba(234, 88, 12, 0.07);
            --s-green: #34C759;
            --s-shadow: 0 1px 2px rgba(0, 0, 0, 0.04), 0 6px 18px rgba(0, 0, 0, 0.05);
        }
        body.dark {
            --s-bg: #000000;
            --s-card: #1C1C1E;
            --s-card2: #2C2C2E;
            --s-text: #FFFFFF;
            --s-text2: rgba(235, 235, 245, 0.62);
            --s-text3: rgba(235, 235, 245, 0.3);
            --s-sep: rgba(84, 84, 88, 0.6);
            --s-fill: rgba(118, 118, 128, 0.24);
            --s-tint: #0A84FF;
            --s-tint-soft: rgba(10, 132, 255, 0.2);
            --s-gold: #F6C453;
            --s-gold-soft: rgba(246, 196, 83, 0.16);
            --s-fri: #FF6961;
            --s-fri-soft: rgba(255, 105, 97, 0.09);
            --s-sat: #FFA35C;
            --s-sat-soft: rgba(255, 163, 92, 0.08);
            --s-green: #30D158;
            --s-shadow: none;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Arabic", 'IBM Plex Sans Arabic', system-ui, sans-serif;
            direction: rtl; text-align: right;
            min-height: 100vh;
            background: var(--s-bg); color: var(--s-text);
            overflow-x: hidden;
            padding-bottom: calc(var(--sab) + 96px);
        }
        button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
        [hidden] { display: none !important; }
        .num { font-variant-numeric: tabular-nums; }

        .sch { max-width: 1100px; margin: 0 auto; padding: 10px 16px 0; }

        /* ---------- Header ---------- */
        .sch-head { display: grid; gap: 12px; margin-bottom: 14px; }
        .sch-title-row { display: flex; align-items: center; gap: 10px; }
        .sch-title-row > div:first-child { flex: 1; min-width: 0; }
        .sch-title { font-size: 1.55rem; font-weight: 800; letter-spacing: -0.01em; line-height: 1.2; }
        .sch-hosp { font-size: 0.82rem; color: var(--s-text2); font-weight: 600; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .sch-icon-btn {
            flex: none; width: 40px; height: 40px; border-radius: 50%;
            background: var(--s-card); color: var(--s-tint); box-shadow: var(--s-shadow);
            display: inline-flex; align-items: center; justify-content: center; font-size: 0.95rem;
        }
        .sch-icon-btn.on { background: var(--s-tint); color: #fff; }

        .sch-search { display: flex; align-items: center; gap: 8px; height: 42px; padding: 0 12px; border-radius: 12px; background: var(--s-fill); }
        .sch-search i { color: var(--s-text2); font-size: 0.85rem; }
        .sch-search input { flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; color: var(--s-text); font: inherit; font-size: 16px; }
        .sch-search input::-webkit-search-cancel-button { display: none; }
        .sch-search button { color: var(--s-text3); font-size: 1rem; width: 28px; height: 28px; }

        .sch-month { display: flex; align-items: center; gap: 8px; }
        .sch-month-btn {
            flex: none; width: 40px; height: 40px; border-radius: 12px; background: var(--s-card);
            box-shadow: var(--s-shadow); color: var(--s-tint); display: inline-flex; align-items: center; justify-content: center;
        }
        .sch-month-label { flex: 1; min-width: 0; text-align: center; font-weight: 800; font-size: 1.02rem; }
        .sch-month-label small { display: block; font-size: 0.7rem; color: var(--s-text2); font-weight: 600; }
        .sch-today { flex: none; height: 40px; padding: 0 14px; border-radius: 12px; background: var(--s-tint-soft); color: var(--s-tint); font-weight: 800; font-size: 0.82rem; }

        /* Segmented controls (iOS style) */
        .sch-seg { display: flex; padding: 2px; border-radius: 10px; background: var(--s-fill); }
        .sch-seg button {
            flex: 1; min-width: 0; height: 34px; border-radius: 8px; font-size: 0.8rem; font-weight: 700; color: var(--s-text);
            display: inline-flex; align-items: center; justify-content: center; gap: 6px; white-space: nowrap;
        }
        .sch-seg button i { font-size: 0.75rem; opacity: 0.75; }
        .sch-seg button.active { background: var(--s-card); box-shadow: 0 1px 3px rgba(0,0,0,.12), 0 1px 1px rgba(0,0,0,.04); font-weight: 800; }
        body.dark .sch-seg button.active { background: #636366; }

        /* ---------- Horizontal strips (days, specialties) ---------- */
        .strip {
            display: flex; gap: 8px; overflow-x: auto; overscroll-behavior-x: contain;
            scroll-snap-type: x proximity; scrollbar-width: none;
            margin: 0 -16px; padding: 4px 16px 10px;
        }
        .strip::-webkit-scrollbar { display: none; }
        .ds-day {
            flex: none; scroll-snap-align: center; width: 50px; padding: 7px 0 6px; border-radius: 14px;
            background: var(--s-card); box-shadow: var(--s-shadow);
            display: flex; flex-direction: column; align-items: center; gap: 1px; position: relative;
        }
        .ds-day .dn { font-size: 0.66rem; font-weight: 700; color: var(--s-text2); }
        .ds-day .dd { font-size: 1.1rem; font-weight: 800; }
        .ds-day.fri .dn, .ds-day.fri .dd { color: var(--s-fri); }
        .ds-day.sat .dn, .ds-day.sat .dd { color: var(--s-sat); }
        .ds-day.today { box-shadow: inset 0 0 0 2px var(--s-gold); }
        .ds-day.sel { background: var(--s-tint); box-shadow: 0 4px 12px rgba(0, 122, 255, .3); }
        .ds-day.sel .dn, .ds-day.sel .dd { color: #fff; }
        .ds-day .mine-dot { position: absolute; bottom: 3px; width: 5px; height: 5px; border-radius: 50%; background: var(--s-gold); }
        .ds-day.sel .mine-dot { background: #fff; }

        .spec-chip {
            flex: none; scroll-snap-align: center; height: 36px; padding: 0 14px; border-radius: 18px;
            background: var(--s-card); box-shadow: var(--s-shadow); font-size: 0.8rem; font-weight: 700;
            display: inline-flex; align-items: center; gap: 6px; white-space: nowrap;
        }
        .spec-chip .sw { width: 8px; height: 8px; border-radius: 50%; background: var(--c); }
        .spec-chip.sel { background: var(--c); color: #fff; box-shadow: none; }
        .spec-chip.sel .sw { background: rgba(255,255,255,.85); }

        /* ---------- Section heading ---------- */
        .sec-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin: 6px 4px 10px; }
        .sec-head h2 { font-size: 1.12rem; font-weight: 800; }
        .sec-head .count { font-size: 0.75rem; font-weight: 700; color: var(--s-text2); white-space: nowrap; }
        .today-tag { display: inline-block; vertical-align: 2px; margin-inline-start: 6px; font-size: 0.66rem; font-weight: 800; padding: 2px 8px; border-radius: 10px; background: var(--s-gold-soft); color: var(--s-gold); }

        /* ---------- Day agenda: one card per specialty ---------- */
        .agenda { display: grid; gap: 10px; }
        @media (min-width: 720px) { .agenda { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
        @media (min-width: 1040px) { .agenda { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
        .ag-card { background: var(--s-card); border-radius: 16px; box-shadow: var(--s-shadow); overflow: hidden; }
        .ag-spec { display: flex; align-items: center; gap: 8px; padding: 10px 14px 6px; font-size: 0.78rem; font-weight: 800; color: var(--c); }
        .ag-spec .ic { width: 26px; height: 26px; border-radius: 8px; display: inline-flex; align-items: center; justify-content: center; font-size: 0.9rem; background: color-mix(in srgb, var(--c) 14%, transparent); }
        .ag-spec .clone { font-size: 0.66rem; color: var(--s-text2); font-weight: 600; }
        .doc-row { display: flex; align-items: center; gap: 10px; padding: 8px 14px; min-height: 52px; width: 100%; text-align: right; }
        .doc-row + .doc-row { border-top: 0.5px solid var(--s-sep); }
        .doc-row:active { background: var(--s-fill); }
        .doc-av {
            flex: none; width: 34px; height: 34px; border-radius: 50%; font-size: 0.85rem; font-weight: 800;
            display: inline-flex; align-items: center; justify-content: center;
            background: color-mix(in srgb, var(--c) 16%, transparent); color: var(--c);
        }
        .doc-main { flex: 1; min-width: 0; }
        .doc-name { font-size: 0.92rem; font-weight: 700; line-height: 1.35; overflow-wrap: anywhere; }
        .doc-sub { font-size: 0.72rem; color: var(--s-text2); font-weight: 600; margin-top: 1px; }
        .doc-acts { flex: none; display: flex; gap: 6px; }
        .doc-act { width: 34px; height: 34px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-size: 0.85rem; background: var(--s-fill); color: var(--s-tint); }
        .doc-act.wa { color: #25A35A; }
        .doc-row.mine { background: var(--s-gold-soft); }
        .doc-row.mine .doc-name::after { content: 'خفارتك'; margin-inline-start: 6px; font-size: 0.62rem; font-weight: 800; padding: 1px 7px; border-radius: 8px; background: var(--s-gold); color: #fff; vertical-align: 2px; }
        body.dark .doc-row.mine .doc-name::after { color: #000; }
        .doc-row.hit .doc-name { background: linear-gradient(transparent 55%, rgba(255, 204, 0, .45) 55%); }

        .empty-note { margin-top: 12px; padding: 12px 14px; border-radius: 14px; background: var(--s-card); box-shadow: var(--s-shadow); font-size: 0.75rem; color: var(--s-text2); line-height: 1.9; }
        .empty-note b { color: var(--s-text); font-weight: 700; display: block; margin-bottom: 4px; font-size: 0.78rem; }
        .empty-note span { display: inline-block; padding: 0 8px; margin: 2px 0 2px 4px; border-radius: 8px; background: var(--s-fill); font-weight: 600; }
        .blank { padding: 40px 16px; text-align: center; color: var(--s-text2); font-size: 0.85rem; font-weight: 600; background: var(--s-card); border-radius: 16px; box-shadow: var(--s-shadow); }
        .blank i { display: block; font-size: 1.8rem; margin-bottom: 10px; color: var(--s-text3); }

        /* ---------- One specialty: the month as a list ---------- */
        .mlist { background: var(--s-card); border-radius: 16px; box-shadow: var(--s-shadow); overflow: hidden; }
        .mrow { display: flex; align-items: stretch; gap: 0; }
        .mrow + .mrow { border-top: 0.5px solid var(--s-sep); }
        .mrow .mday { flex: none; width: 58px; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 8px 0; background: var(--s-card2); }
        .mrow .mday b { font-size: 1.05rem; font-weight: 800; }
        .mrow .mday span { font-size: 0.64rem; font-weight: 700; color: var(--s-text2); }
        .mrow.fri .mday { background: var(--s-fri-soft); } .mrow.fri .mday b, .mrow.fri .mday span { color: var(--s-fri); }
        .mrow.sat .mday { background: var(--s-sat-soft); } .mrow.sat .mday b, .mrow.sat .mday span { color: var(--s-sat); }
        .mrow.today .mday { background: var(--s-gold-soft); } .mrow.today .mday b { color: var(--s-gold); }
        .mrow .mdocs { flex: 1; min-width: 0; }
        .mrow .mdocs .doc-row { min-height: 48px; }
        .mrow .none { display: flex; align-items: center; height: 100%; min-height: 46px; padding: 0 14px; font-size: 0.78rem; color: var(--s-text3); font-weight: 600; }

        /* ---------- Full table: one scroller, sticky header + day column ---------- */
        .grid-bar { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin: 0 4px 8px; font-size: 0.74rem; color: var(--s-text2); font-weight: 600; }
        .grid-bar label { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; font-weight: 700; color: var(--s-text); }
        .grid-wrap { background: var(--s-card); border-radius: 16px; box-shadow: var(--s-shadow); overflow: hidden; }
        .grid-scroll {
            overflow: auto; overscroll-behavior: contain; -webkit-overflow-scrolling: touch;
            max-height: calc(100dvh - 190px);
            contain: paint;
        }
        .grid-table { border-collapse: separate; border-spacing: 0; font-size: 0.74rem; min-width: 100%; }
        .grid-table th, .grid-table td { border-bottom: 0.5px solid var(--s-sep); border-left: 0.5px solid var(--s-sep); background: var(--s-card); }
        .grid-table thead th {
            position: sticky; top: 0; z-index: 2; padding: 8px 6px; min-width: 104px; max-width: 132px;
            font-weight: 800; font-size: 0.72rem; line-height: 1.25; text-align: center; vertical-align: bottom;
            background: var(--s-card2); border-bottom: 2px solid var(--c, var(--s-sep));
        }
        .grid-table thead th .ic { display: block; font-size: 0.95rem; margin-bottom: 2px; }
        .grid-table th.dcol, .grid-table td.dcol { position: sticky; right: 0; z-index: 1; width: 52px; min-width: 52px; text-align: center; background: var(--s-card2); }
        .grid-table thead th.dcol { z-index: 3; }
        .grid-table td.dcol b { display: block; font-size: 0.95rem; font-weight: 800; }
        .grid-table td.dcol span { font-size: 0.6rem; font-weight: 700; color: var(--s-text2); }
        .grid-table td { padding: 4px; vertical-align: middle; text-align: center; }
        .grid-table tr.fri td { background: color-mix(in srgb, var(--s-fri) 5%, var(--s-card)); }
        .grid-table tr.sat td { background: color-mix(in srgb, var(--s-sat) 5%, var(--s-card)); }
        .grid-table tr.fri td.dcol { background: color-mix(in srgb, var(--s-fri) 12%, var(--s-card2)); color: var(--s-fri); }
        .grid-table tr.sat td.dcol { background: color-mix(in srgb, var(--s-sat) 12%, var(--s-card2)); color: var(--s-sat); }
        .grid-table tr.today td { background: color-mix(in srgb, var(--s-gold) 12%, var(--s-card)); }
        .grid-table tr.today td.dcol { background: var(--s-gold); color: #fff; }
        .grid-table tr.today td.dcol span { color: rgba(255,255,255,.9); }
        body.dark .grid-table tr.today td.dcol, body.dark .grid-table tr.today td.dcol span { color: #000; }
        .gname {
            display: block; width: 100%; padding: 5px 6px; border-radius: 8px; font-size: 0.72rem; font-weight: 700; line-height: 1.3;
            background: color-mix(in srgb, var(--c) 10%, transparent); color: var(--s-text);
        }
        .gname + .gname { margin-top: 3px; }
        .gname small { display: block; font-size: 0.6rem; color: var(--s-text2); font-weight: 600; }
        .gname.mine { background: var(--s-gold); color: #fff; }
        .gname.mine small { color: rgba(255,255,255,.85); }
        body.dark .gname.mine, body.dark .gname.mine small { color: #000; }
        .gname.hit { box-shadow: inset 0 0 0 2px #FFCC00; }
        .gname.dim { opacity: 0.35; }
        .gdash { color: var(--s-text3); }

        /* ---------- Search results ---------- */
        .res-day { margin-bottom: 10px; }
        .res-day h3 { font-size: 0.78rem; font-weight: 800; color: var(--s-text2); margin: 0 6px 6px; }

        /* ---------- Duty sheet ---------- */
        .hub-modal-overlay { position: fixed; inset: 0; z-index: 1000; background: rgba(0,0,0,.35); display: flex; align-items: center; justify-content: center; padding: 16px; }
        .hub-modal-card { width: 100%; max-width: 420px; max-height: 90vh; overflow-y: auto; background: var(--s-card); border-radius: 22px; padding: 20px; display: flex; flex-direction: column; }
        .sh-top { display: flex; align-items: flex-start; gap: 12px; }
        .sh-top .doc-av { width: 48px; height: 48px; font-size: 1.1rem; }
        .sh-top h3 { font-size: 1.12rem; font-weight: 800; line-height: 1.3; }
        .sh-top p { font-size: 0.8rem; color: var(--s-text2); font-weight: 600; margin-top: 2px; }
        .sh-close { margin-inline-start: auto; width: 32px; height: 32px; border-radius: 50%; background: var(--s-fill); color: var(--s-text2); flex: none; }
        .sh-facts { margin-top: 14px; border-radius: 14px; background: var(--s-card2); }
        .sh-facts div { display: flex; justify-content: space-between; gap: 10px; padding: 11px 14px; font-size: 0.82rem; }
        .sh-facts div + div { border-top: 0.5px solid var(--s-sep); }
        .sh-facts span { color: var(--s-text2); font-weight: 600; }
        .sh-facts b { font-weight: 700; text-align: left; }
        .sh-acts { display: flex; gap: 8px; margin-top: 12px; }
        .sh-acts a { flex: 1; height: 46px; border-radius: 14px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; font-weight: 800; font-size: 0.88rem; text-decoration: none; }
        .sh-acts .call { background: var(--s-tint); color: #fff; }
        .sh-acts .wa { background: rgba(37, 211, 102, .14); color: #1F9D55; flex: 0 0 64px; font-size: 1.2rem; }
        .sh-more h4 { font-size: 0.78rem; font-weight: 800; color: var(--s-text2); margin: 16px 4px 6px; }
        .sh-more ul { list-style: none; border-radius: 14px; background: var(--s-card2); }
        .sh-more li { display: flex; justify-content: space-between; gap: 10px; padding: 9px 14px; font-size: 0.8rem; font-weight: 600; }
        .sh-more li + li { border-top: 0.5px solid var(--s-sep); }
        .sh-more li.now { color: var(--s-gold); font-weight: 800; }
        .sh-more li span { color: var(--s-text2); }
        .sh-note { font-size: 0.78rem; color: var(--s-text2); text-align: center; margin-top: 12px; }

        @media (min-width: 769px) {
            .sch { padding-top: 20px; }
            .sch-head { grid-template-columns: 1fr auto; align-items: center; }
            .sch-title-row, .sch-search { grid-column: 1 / -1; }
            .sch-month { grid-column: 1 / -1; max-width: 460px; }
            .sch-segs { grid-column: 1 / -1; display: flex; gap: 12px; }
            .sch-segs .sch-seg { flex: 1; max-width: 420px; }
        }
        .sch-segs { display: grid; gap: 8px; }
        @media (prefers-reduced-motion: no-preference) {
            .view-anim { animation: sch-in 0.22s ease-out both; }
            @keyframes sch-in { from { opacity: 0; } to { opacity: 1; } }
        }

        @media print {
            #universal-nav, .no-print, .hub-mobile-bottom-dock, .ios-bottom-dock { display: none !important; }
            body { background: white !important; color: black !important; padding: 0 !important; }
        }
    </style>
    <link rel="stylesheet" href="./tailwind.css" />
    <link rel="stylesheet" href="./hub-ios.css" />
</head>
<body class="light">

    <div id="universal-nav"></div>

    <main class="sch" id="schedule-main-content">
        <header class="sch-head no-print">
            <div class="sch-title-row">
                <div>
                    <h1 class="sch-title" id="hosp-display-name">جدول الخفارات</h1>
                    <p class="sch-hosp" id="hosp-location-text"></p>
                </div>
                <button type="button" class="sch-icon-btn" id="btn-search" onclick="toggleSearch()" aria-label="بحث عن طبيب"><i class="fas fa-magnifying-glass"></i></button>
                <button type="button" class="sch-icon-btn" onclick="printSchedule()" aria-label="طباعة الجدول على ورقة A4"><i class="fas fa-print"></i></button>
            </div>

            <div class="sch-search" id="sch-search" hidden>
                <i class="fas fa-magnifying-glass"></i>
                <input type="search" id="doctor-search-input" placeholder="ابحث باسم الطبيب لعرض خفاراته…" autocomplete="off" oninput="handleDoctorSearch(this.value)" />
                <button type="button" onclick="clearSearch()" aria-label="مسح"><i class="fas fa-circle-xmark"></i></button>
            </div>

            <div class="sch-month">
                <button type="button" class="sch-month-btn" onclick="navigateMonth(-1)" aria-label="الشهر السابق"><i class="fas fa-chevron-right"></i></button>
                <div class="sch-month-label" id="current-month-display"></div>
                <button type="button" class="sch-month-btn" onclick="navigateMonth(1)" aria-label="الشهر القادم"><i class="fas fa-chevron-left"></i></button>
                <button type="button" class="sch-today" id="btn-jump-today" onclick="jumpToCurrentMonth()">اليوم</button>
            </div>

            <div class="sch-segs">
                <div class="sch-seg" id="schedule-role-selector" role="tablist">
                    <button type="button" id="btn-role-residents" class="active" onclick="setScheduleRole('residents')"><i class="fas fa-user-doctor"></i> المقيمين</button>
                    <button type="button" id="btn-role-specialists" onclick="setScheduleRole('specialists')"><i class="fas fa-user-tie"></i> الاختصاصيين</button>
                </div>
                <div class="sch-seg" id="view-mode-selector" role="tablist">
                    <button type="button" id="btn-mode-day" class="active" onclick="setViewMode('day')"><i class="fas fa-calendar-day"></i> اليوم</button>
                    <button type="button" id="btn-mode-single" onclick="setViewMode('single')"><i class="fas fa-stethoscope"></i> تخصص</button>
                    <button type="button" id="btn-mode-matrix" onclick="setViewMode('matrix')"><i class="fas fa-table-cells"></i> الشامل</button>
                </div>
            </div>
        </header>

        <!-- Day agenda: who is on duty on one day, by specialty -->
        <section id="view-day">
            <div class="strip no-print" id="day-strip" aria-label="أيام الشهر"></div>
            <div class="sec-head"><h2 id="day-title"></h2><span class="count num" id="day-count"></span></div>
            <div id="day-list"></div>
        </section>

        <!-- One specialty: the whole month as a list -->
        <section id="view-single" hidden>
            <div class="strip no-print" id="spec-pills-list" aria-label="التخصصات"></div>
            <div class="sec-head"><h2 id="single-spec-title"></h2><span class="count num" id="single-spec-duties-count"></span></div>
            <div id="single-list"></div>
        </section>

        <!-- Every specialty: the month as a table -->
        <section id="view-matrix" hidden>
            <div class="grid-bar">
                <span id="matrix-stats-text"></span>
                <label><input type="checkbox" id="grid-all-specs" onchange="renderMatrixView()" /> كل التخصصات</label>
            </div>
            <div class="grid-wrap"><div class="grid-scroll" id="grid-scroll"><table class="grid-table" id="schedule-matrix-table"></table></div></div>
        </section>

        <!-- Search: a doctor's duties this month -->
        <section id="view-search" hidden>
            <div class="sec-head"><h2 id="search-title"></h2><span class="count num" id="search-count"></span></div>
            <div id="search-list"></div>
        </section>
    </main>

    <div id="duty-detail-modal" class="hub-modal-overlay" onclick="if (event.target === this) closeDutyDetailModal()">
        <div class="hub-modal-card" role="dialog" aria-modal="true" id="modal-duty-body"></div>
    </div>

    <script src="./hub-sync.js"></script>
    <script src="./hub-core.js"></script>
    <script src="./hub-aa.js"></script>
    <script src="./hub-avatar.js"></script>
    <script src="./pwa.js"></script>
    <script src="./hub-accounts.js"></script>
    <script src="./nav-component.js"></script>

    <script>
        let currentYear = 2026;
        let currentMonth = 9; // 1-indexed
        let currentHospital = null;
        let currentViewMode = 'day'; // 'day' | 'single' | 'matrix'
        let currentScheduleRole = 'residents'; // 'residents' | 'specialists'
        let selectedSpecialtyId = null;
        let selectedDay = 1;
        let searchQuery = '';

        const MONTH_NAMES_AR = [
            'كانون الثاني / يناير', 'شباط / فبراير', 'آذار / مارس', 'نيسان / أبريل',
            'أيار / مايو', 'حزيران / يونيو', 'تموز / يوليو', 'آب / أغسطس',
            'أيلول / سبتمبر', 'تشرين الأول / أكتوبر', 'تشرين الثاني / نوفمبر', 'كانون الأول / ديسمبر'
        ];
        const MONTH_SHORT_AR = ['كانون الثاني', 'شباط', 'آذار', 'نيسان', 'أيار', 'حزيران', 'تموز', 'آب', 'أيلول', 'تشرين الأول', 'تشرين الثاني', 'كانون الأول'];

        const DAY_NAMES_AR = ['الأحد', 'الإثنين', 'الثلاثاء', 'الأربعاء', 'الخميس', 'الجمعة', 'السبت'];

        // ================================================================
        // PRINT: the month on a single A4 sheet (a table built for paper, fitted to the page)
        // ================================================================
        const escPrint = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
        const shortDoctorName = n => String(n || '').replace(/^(د\s*\.|د\s|الدكتور(ة)?\s|دكتور(ة)?\s)\s*/, '').trim().split(/\s+/).slice(0, 2).join(' ');
        function shortDutyTime(t) {
            const m = String(t || '').match(/(\d{1,2}):(\d{2})\s*(AM|PM)\s*-\s*(\d{1,2}):(\d{2})\s*(AM|PM)/i);
            if (!m) return '';
            const one = (h, mm, ap) => `${Number(h) % 12 || 12}${mm !== '00' ? ':' + mm : ''}${ap.toUpperCase() === 'AM' ? 'ص' : 'م'}`;
            return `${one(m[1], m[2], m[3])}–${one(m[4], m[5], m[6])}`;
        }

        /** The sheet's HTML for the month on screen (all specialties with duties, or the one chosen in "تخصص محدد"). */
        function buildPrintSheet(compact) {
            const daysCount = getDaysInMonth(currentYear, currentMonth);
            const entries = Hub.getHospitalMonthSchedule(currentHospital.id, currentYear, currentMonth, currentScheduleRole);
            const map = {};
            entries.forEach(e => {
                const p = (e.date || '').split('/');
                if (p.length !== 3 || !(e.name || '').trim()) return;
                const code = e.specCode || e.spec, d = parseInt(p[0], 10);
                map[code] = map[code] || {};
                (map[code][d] = map[code][d] || []).push(e);
            });
            let specs = (currentHospital.specialties || []).filter(s => s.enabled !== false);
            if (currentViewMode === 'single' && selectedSpecialtyId) specs = specs.filter(s => s.id === selectedSpecialtyId);
            else specs = specs.filter(s => map[s.id]); // columns without a single duty this month are left out
            const roleLabel = currentScheduleRole === 'specialists' ? 'خفارات الاختصاصيين' : 'خفارات المقيمين';
            const monthLabel = `${MONTH_NAMES_AR[currentMonth - 1]} ${currentYear}`;
            const hospName = currentHospital.name_ar || currentHospital.hospitalName || '';
            const accent = /^#[0-9a-f]{3,8}$/i.test(currentHospital.color || '') ? currentHospital.color : '#0f766e';
            const single = specs.length === 1 && currentViewMode === 'single';
            const total = specs.reduce((n, s) => n + Object.values(map[s.id] || {}).reduce((k, l) => k + l.length, 0), 0);
            const q = searchQuery;

            const nameCell = list => list.map(e => {
                const full = (e.name || '').trim();
                const name = compact ? shortDoctorName(full) : full;
                const t = list.length > 1 ? shortDutyTime(e.dutyTime) : '';
                const hit = q && full.toLowerCase().includes(q);
                return `<div class="n${hit ? ' hit' : ''}">${escPrint(name)}${t ? ` <span class="t">${t}</span>` : ''}</div>`;
            }).join('');

            let head = `<th class="day">اليوم</th>`;
            specs.forEach(s => {
                const nm = (Hub.getSpecialtyName ? Hub.getSpecialtyName(s.id) : '') || s.name_ar || s.id;
                head += `<th style="--c:${escPrint(s.color || accent)}">${single ? 'الطبيب الخافر' : escPrint(nm)}</th>`;
            });
            let body = '';
            for (let d = 1; d <= daysCount; d++) {
                const dow = new Date(currentYear, currentMonth - 1, d).getDay();
                body += `<tr class="${dow === 5 ? 'fri' : dow === 6 ? 'sat' : ''}"><td class="day"><b>${d}</b><span>${DAY_NAMES_AR[dow]}</span></td>`;
                specs.forEach(s => {
                    const list = (map[s.id] || {})[d] || [];
                    body += `<td>${list.length ? nameCell(list) : '<span class="dash">—</span>'}</td>`;
                });
                body += '</tr>';
            }
            const printed = new Date().toLocaleString('en-GB', { day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' });
            const title = single ? `${(Hub.getSpecialtyName ? Hub.getSpecialtyName(specs[0].id) : '') || specs[0].name_ar} · ${roleLabel}` : `جدول ${roleLabel}`;
            return {
                landscape: specs.length > 4,
                html: specs.length ? `
                <div class="hpr-page" dir="rtl" style="--accent:${accent}">
                    <header class="hpr-head">
                        <div>
                            <div class="hpr-hosp">${escPrint(hospName)}</div>
                            <div class="hpr-title">${escPrint(title)} <span>· ${escPrint(monthLabel)}</span></div>
                        </div>
                        <div class="hpr-brand"><b>Hospital Hub</b><span>بوابة المستشفيات التعليمية</span></div>
                    </header>
                    <table class="hpr-table${single ? ' single' : ''}"><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table>
                    <footer class="hpr-foot">
                        <span><i class="sw fri"></i> الجمعة <i class="sw sat"></i> السبت · ${total} خفارة${specs.length > 1 ? ` في ${specs.length} تخصص` : ''}</span>
                        <span dir="ltr">Printed ${escPrint(printed)}</span>
                    </footer>
                </div>` : '',
            };
        }

        const PRINT_CSS = `
            @media screen { #hub-print-root { position: fixed; left: -20000px; top: 0; visibility: hidden; pointer-events: none; } }
            #hub-print-root, #hub-print-root * { box-sizing: border-box; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
            #hub-print-root .hpr-page { font-family: 'IBM Plex Sans Arabic', 'Cairo', 'Segoe UI', Tahoma, sans-serif; color: #0f172a; background: #fff; font-size: var(--fs, 9pt); }
            #hub-print-root .hpr-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; padding-bottom: 2.2mm; margin-bottom: 2.5mm; border-bottom: 0.6mm solid var(--accent); }
            #hub-print-root .hpr-hosp { font-size: 15pt; font-weight: 800; line-height: 1.2; }
            #hub-print-root .hpr-title { font-size: 10pt; font-weight: 700; color: #334155; margin-top: 0.6mm; }
            #hub-print-root .hpr-title span { color: var(--accent); }
            #hub-print-root .hpr-brand { text-align: left; font-size: 7.5pt; color: #64748b; line-height: 1.35; }
            #hub-print-root .hpr-brand b { display: block; font-size: 9pt; color: #0f172a; letter-spacing: 0.04em; }
            #hub-print-root .hpr-table { width: 100%; border-collapse: collapse; table-layout: fixed; border: 0.35mm solid #334155; }
            #hub-print-root .hpr-table th { background: #1e293b; color: #fff; font-weight: 800; font-size: 0.92em; line-height: 1.2; padding: 1.2mm 0.8mm; border: 0.2mm solid #475569; border-top: 1mm solid var(--c, var(--accent)); vertical-align: middle; text-align: center; word-break: break-word; }
            #hub-print-root .hpr-table td { border: 0.2mm solid #cbd5e1; padding: 0.5mm 0.8mm; text-align: center; vertical-align: middle; line-height: 1.18; word-break: break-word; }
            #hub-print-root .hpr-table tbody tr:nth-child(even) td { background: #f8fafc; }
            #hub-print-root .hpr-table tr.fri td { background: #fef2f2; }
            #hub-print-root .hpr-table tr.sat td { background: #fff7ed; }
            #hub-print-root .hpr-table th.day, #hub-print-root .hpr-table td.day { width: 15mm; }
            #hub-print-root .hpr-table td.day { background: #f1f5f9 !important; white-space: nowrap; }
            #hub-print-root .hpr-table td.day b { font-size: 1.1em; margin-left: 1mm; }
            #hub-print-root .hpr-table td.day span { font-size: 0.82em; color: #475569; }
            #hub-print-root .hpr-table tr.fri td.day { background: #fee2e2 !important; color: #b91c1c; }
            #hub-print-root .hpr-table tr.sat td.day { background: #ffedd5 !important; color: #c2410c; }
            #hub-print-root .hpr-table.single th.day, #hub-print-root .hpr-table.single td.day { width: 32mm; }
            #hub-print-root .hpr-table .n { font-weight: 600; }
            #hub-print-root .hpr-table .n + .n { border-top: 0.15mm dashed #cbd5e1; margin-top: 0.3mm; padding-top: 0.3mm; }
            #hub-print-root .hpr-table .n.hit { font-weight: 800; background: #fef3c7; }
            #hub-print-root .hpr-table .t { font-size: 0.8em; color: #64748b; font-weight: 500; }
            #hub-print-root .hpr-table .dash { color: #cbd5e1; }
            #hub-print-root .hpr-foot { display: flex; justify-content: space-between; margin-top: 2mm; font-size: 7.5pt; color: #64748b; }
            #hub-print-root .sw { display: inline-block; width: 3mm; height: 3mm; border-radius: 0.6mm; vertical-align: -0.4mm; margin: 0 1mm 0 0.5mm; border: 0.2mm solid #cbd5e1; }
            #hub-print-root .sw.fri { background: #fee2e2; } #hub-print-root .sw.sat { background: #ffedd5; }`;

        /** Prints the sheet on one A4 page. Inside the app shell the shell's window prints it (phones print the top page). */
        function printSchedule() {
            if (!currentHospital) return;
            let win = window;
            try { if (window.top !== window && window.top.document && window.top.document.body) win = window.top; } catch (e) {}
            const doc = win.document;
            const old = doc.getElementById('hub-print-root');
            if (old) old.remove();
            const first = buildPrintSheet(false);
            if (!first.html) { showToastSafe('لا توجد خفارات مسجلة في هذا الشهر للطباعة'); return; }
            const landscape = first.landscape;
            const W = landscape ? 297 : 210, H = landscape ? 210 : 297, M = 8;
            const root = doc.createElement('div');
            root.id = 'hub-print-root';
            root.innerHTML = `<style>${PRINT_CSS}
                @media print {
                    @page { size: A4 ${landscape ? 'landscape' : 'portrait'}; margin: ${M}mm; }
                    html, body { background: #fff !important; height: auto !important; min-height: 0 !important; overflow: visible !important; padding: 0 !important; margin: 0 !important; }
                    body > *:not(#hub-print-root) { display: none !important; }
                    #hub-print-root { display: block !important; position: static !important; visibility: visible !important; }
                }</style><div class="hpr-fit" style="width:${W - 2 * M}mm"></div>`;
            doc.body.appendChild(root);
            const fit = root.querySelector('.hpr-fit');
            // Largest font (and full names if they fit) that keeps the whole month on the page.
            const probe = doc.createElement('div');
            probe.style.cssText = 'height:100mm;position:absolute;visibility:hidden';
            root.appendChild(probe);
            const availH = probe.getBoundingClientRect().height / 100 * (H - 2 * M) - 2;
            probe.remove();
            let done = false;
            for (const compact of [false, true]) {
                fit.innerHTML = compact ? buildPrintSheet(true).html : first.html;
                const page = fit.firstElementChild;
                for (const fs of [10, 9.5, 9, 8.5, 8, 7.5, 7, 6.5, 6, 5.5, 5]) {
                    if (!compact && fs < 6.5) break; // below this, short names read better than tiny full names
                    page.style.setProperty('--fs', fs + 'pt');
                    if (page.getBoundingClientRect().height <= availH) { done = true; break; }
                }
                if (done) break;
            }
            if (!done) {
                const page = fit.firstElementChild;
                page.style.zoom = String(Math.max(0.4, availH / page.getBoundingClientRect().height));
            }
            const cleanup = () => { win.removeEventListener('afterprint', cleanup); setTimeout(() => root.remove(), 500); };
            win.addEventListener('afterprint', cleanup);
            win.focus();
            win.print();
        }
        function showToastSafe(msg) { if (typeof showToast === 'function') showToast(msg, 'info'); else alert(msg); }

        // ================================================================
        // DATA HELPERS
        // ================================================================
        const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
        const safeColor = c => /^#[0-9a-f]{3,8}$/i.test(c || '') ? c : '#0f766e';
        const stripTitle = n => String(n || '').replace(/^(د\s*\.|د\s|الدكتور(ة)?\s|دكتور(ة)?\s)\s*/, '').trim();
        const keyOf = n => (window.Hub && Hub.nameKey) ? Hub.nameKey(n || '') : stripTitle(n).toLowerCase();
        const VIEW_KEY = 'schedule_view_mode_v2';

        function getDaysInMonth(year, month) {
            return new Date(year, month, 0).getDate();
        }
        function todayParts() {
            const [d, m, y] = Hub.getMedicalDate().split('/').map(Number);
            return { d, m, y };
        }
        function todayInView() {
            const t = todayParts();
            return t.m === currentMonth && t.y === currentYear ? t.d : null;
        }
        function dayOfWeek(d) { return new Date(currentYear, currentMonth - 1, d).getDay(); }
        function specLabel(spec) { return (Hub.getSpecialtyName ? Hub.getSpecialtyName(spec.id) : '') || spec.name_ar || spec.id; }
        function enabledSpecs() { return ((currentHospital && currentHospital.specialties) || []).filter(s => s.enabled !== false); }
        function cloneSource(spec) {
            if (!spec.isClone || !spec.clonedFromHospitalId) return '';
            const h = Hub.getHospital ? Hub.getHospital(spec.clonedFromHospitalId) : null;
            return h ? (h.name_ar || h.hospitalName || spec.clonedFromHospitalId) : spec.clonedFromHospitalId;
        }

        /** The month's duties: map[specId][day] = entries sorted by slot. */
        function monthMap() {
            const map = {};
            let total = 0;
            if (!currentHospital) return { map, total };
            Hub.getHospitalMonthSchedule(currentHospital.id, currentYear, currentMonth, currentScheduleRole).forEach(e => {
                const p = (e.date || '').split('/');
                if (p.length !== 3 || !(e.name || '').trim()) return;
                const code = e.specCode || e.spec, d = parseInt(p[0], 10);
                ((map[code] = map[code] || {})[d] = map[code][d] || []).push(e);
                total++;
            });
            Object.values(map).forEach(days => Object.values(days).forEach(l => l.sort((a, b) => (Number(a.dutySlot) || 0) - (Number(b.dutySlot) || 0))));
            return { map, total };
        }

        /** The signed-in resident's own duties are marked (personal accounts, residents' roster). */
        function myKey() {
            if (currentScheduleRole !== 'residents') return null;
            const acc = Hub.auth.getAccount && Hub.auth.getAccount();
            return acc && acc.name ? keyOf(acc.name) : null;
        }

        function phoneOf(name) {
            let phone = '';
            if (currentScheduleRole === 'specialists') {
                const k = keyOf(name);
                const doc = ((Hub.specialists && Hub.specialists.getAll()) || []).find(s => keyOf(s.name) === k);
                phone = doc ? doc.phone : '';
            } else {
                const r = Hub.getResident(name);
                phone = r ? r.phone : '';
            }
            phone = String(phone || '').trim();
            return phone && phone !== 'رقم غير متوفر' ? phone : '';
        }
        function waLink(phone) {
            let digits = phone.replace(/[^0-9]/g, '');
            if (digits.startsWith('0')) digits = '964' + digits.slice(1);
            return 'https://wa.me/' + digits;
        }

        function matchesSearch(name) {
            if (!searchQuery) return false;
            const n = String(name || '').toLowerCase();
            if (n.includes(searchQuery)) return true;
            const k = keyOf(searchQuery);
            return !!k && keyOf(name).includes(k);
        }

        // Each rendered duty gets an index, so a tap opens its sheet without re-parsing anything.
        let dutyRegistry = [];
        function register(entry, spec, d) { dutyRegistry.push({ entry, spec, d }); return dutyRegistry.length - 1; }

        function docRow(entry, spec, d, mine, sub) {
            const i = register(entry, spec, d);
            const name = (entry.name || '').trim();
            const phone = phoneOf(name);
            const time = shortDutyTime(entry.dutyTime);
            const subText = [sub, time].filter(Boolean).join(' · ');
            return `
                <div class="doc-row${mine ? ' mine' : ''}${matchesSearch(name) ? ' hit' : ''}" style="--c:${safeColor(spec.color)}" role="button" tabindex="0" onclick="openDuty(${i})">
                    <span class="doc-av">${esc(stripTitle(name).charAt(0) || '؟')}</span>
                    <span class="doc-main">
                        <span class="doc-name" style="display:block">${esc(name)}</span>
                        ${subText ? `<span class="doc-sub" style="display:block">${esc(subText)}</span>` : ''}
                    </span>
                    ${phone ? `<span class="doc-acts">
                        <a class="doc-act" href="tel:${esc(phone)}" onclick="event.stopPropagation()" aria-label="اتصال"><i class="fas fa-phone"></i></a>
                        <a class="doc-act wa" href="${waLink(phone)}" target="_blank" rel="noopener" onclick="event.stopPropagation()" aria-label="واتساب"><i class="fab fa-whatsapp"></i></a>
                    </span>` : ''}
                </div>`;
        }

        /** Keeps the chosen day / specialty in the middle of its strip (no page jump, works in RTL). */
        function centerInStrip(strip, el) {
            if (!strip || !el) return;
            const s = strip.getBoundingClientRect(), r = el.getBoundingClientRect();
            strip.scrollLeft += (r.left + r.width / 2) - (s.left + s.width / 2);
        }

        // ================================================================
        // INIT & CONTROLS
        // ================================================================
        async function initSchedule() {
            if (!Hub.auth.isLoggedIn()) {
                window.location.href = './index.html';
                return;
            }
            if (window.initUniversalNav) window.initUniversalNav('schedule');

            await Hub.loadDatabase();

            const t = todayParts();
            currentMonth = t.m;
            currentYear = t.y;
            selectedDay = t.d;

            const urlParams = new URLSearchParams(window.location.search);
            if (urlParams.get('type') === 'specialists' || urlParams.get('role') === 'specialists') currentScheduleRole = 'specialists';
            let saved = null;
            try { saved = localStorage.getItem(VIEW_KEY); } catch (e) {}
            const asked = urlParams.get('view');
            currentViewMode = ['day', 'single', 'matrix'].includes(asked) ? asked
                : ['day', 'single', 'matrix'].includes(saved) ? saved
                : (window.innerWidth >= 900 ? 'matrix' : 'day');

            currentHospital = Hub.getActiveHospital();
            updateScheduleRoleButtons();
            renderHospitalInfo();
            renderMonthControls();
            applyViewMode();
            setupSwipe();
            setTimeout(() => scrollToToday(t.d), 250);

            window.addEventListener('hub:hospital-switched', () => {
                currentHospital = Hub.getActiveHospital();
                selectedSpecialtyId = null;
                renderHospitalInfo();
                renderSchedule();
            });
            window.addEventListener('hub:data-changed', () => {
                currentHospital = Hub.getActiveHospital();
                renderSchedule();
            });
        }

        function setScheduleRole(role) {
            currentScheduleRole = (role === 'specialists') ? 'specialists' : 'residents';
            try {
                const url = new URL(window.location.href);
                url.searchParams.set('type', currentScheduleRole);
                window.history.replaceState({}, '', url.toString());
            } catch (e) {}
            updateScheduleRoleButtons();
            renderHospitalInfo();
            renderSchedule();
        }

        function updateScheduleRoleButtons() {
            document.getElementById('btn-role-residents').classList.toggle('active', currentScheduleRole === 'residents');
            document.getElementById('btn-role-specialists').classList.toggle('active', currentScheduleRole === 'specialists');
        }

        function renderHospitalInfo() {
            if (!currentHospital) return;
            const hospName = currentHospital.name_ar || currentHospital.hospitalName || '';
            const roleLabel = currentScheduleRole === 'specialists' ? 'خفارات الاختصاصيين' : 'خفارات المقيمين';
            document.getElementById('hosp-display-name').textContent = 'جدول الخفارات';
            document.getElementById('hosp-location-text').textContent = `${hospName} · ${roleLabel}`;
            document.title = `${hospName} · جدول ${roleLabel}`;
        }

        function renderMonthControls() {
            const el = document.getElementById('current-month-display');
            const t = todayParts();
            const here = t.m === currentMonth && t.y === currentYear;
            el.innerHTML = `${esc(MONTH_SHORT_AR[currentMonth - 1])} <span class="num">${currentYear}</span><small>${here ? 'الشهر الحالي' : esc(MONTH_NAMES_AR[currentMonth - 1].split('/')[1] || '')}</small>`;
        }

        function navigateMonth(delta, day) {
            currentMonth += delta;
            if (currentMonth > 12) { currentMonth = 1; currentYear++; }
            else if (currentMonth < 1) { currentMonth = 12; currentYear--; }
            const n = getDaysInMonth(currentYear, currentMonth);
            selectedDay = day != null ? Math.min(day, n) : (todayInView() || 1);
            renderMonthControls();
            renderSchedule();
            if (currentViewMode !== 'day') window.scrollTo({ top: 0, behavior: 'auto' });
        }

        function jumpToCurrentMonth() {
            const t = todayParts();
            const changed = currentMonth !== t.m || currentYear !== t.y;
            currentMonth = t.m;
            currentYear = t.y;
            selectedDay = t.d;
            if (searchQuery) clearSearch();
            renderMonthControls();
            renderSchedule();
            setTimeout(() => scrollToToday(t.d), changed ? 120 : 20);
        }

        function scrollToToday(day) {
            if (searchQuery) return;
            if (currentViewMode === 'single') {
                const row = document.getElementById(`m-day-${day}`);
                if (row) row.scrollIntoView({ behavior: 'smooth', block: 'center' });
            } else if (currentViewMode === 'matrix') {
                const sc = document.getElementById('grid-scroll');
                const row = document.getElementById(`g-day-${day}`);
                const head = sc && sc.querySelector('thead');
                if (sc && row) sc.scrollTop = Math.max(0, row.offsetTop - (head ? head.offsetHeight : 0) - 8);
            }
        }

        function setViewMode(mode) {
            currentViewMode = ['day', 'single', 'matrix'].includes(mode) ? mode : 'day';
            try { localStorage.setItem(VIEW_KEY, currentViewMode); } catch (e) {}
            applyViewMode();
            const today = todayInView();
            if (today) setTimeout(() => scrollToToday(today), 60);
        }

        function applyViewMode() {
            ['day', 'single', 'matrix'].forEach(m => {
                document.getElementById(`btn-mode-${m}`).classList.toggle('active', currentViewMode === m);
            });
            renderSchedule();
        }

        function toggleSearch() {
            const box = document.getElementById('sch-search');
            const open = box.hidden;
            box.hidden = !open;
            document.getElementById('btn-search').classList.toggle('on', open);
            if (open) document.getElementById('doctor-search-input').focus();
            else clearSearch();
        }

        function handleDoctorSearch(query) {
            searchQuery = (query || '').trim().toLowerCase();
            renderSchedule();
        }

        function clearSearch() {
            const input = document.getElementById('doctor-search-input');
            if (input) input.value = '';
            searchQuery = '';
            renderSchedule();
        }

        function renderSchedule() {
            dutyRegistry = [];
            const searching = !!searchQuery;
            document.getElementById('view-search').hidden = !searching;
            document.getElementById('view-day').hidden = searching || currentViewMode !== 'day';
            document.getElementById('view-single').hidden = searching || currentViewMode !== 'single';
            document.getElementById('view-matrix').hidden = searching || currentViewMode !== 'matrix';
            if (!currentHospital) return;
            if (searching) renderSearchView();
            else if (currentViewMode === 'single') renderSingleSpecialtyView();
            else if (currentViewMode === 'matrix') renderMatrixView();
            else renderDayView();
        }

        // ================================================================
        // 1. DAY AGENDA
        // ================================================================
        function selectDay(d) {
            selectedDay = d;
            renderDayView();
        }

        function shiftDay(delta) {
            const n = getDaysInMonth(currentYear, currentMonth);
            const next = selectedDay + delta;
            if (next < 1) navigateMonth(-1, 31);
            else if (next > n) navigateMonth(1, 1);
            else selectDay(next);
        }

        function renderDayView() {
            const n = getDaysInMonth(currentYear, currentMonth);
            selectedDay = Math.min(Math.max(1, selectedDay), n);
            const today = todayInView();
            const { map } = monthMap();
            const specs = enabledSpecs();
            const me = myKey();

            const mineDays = new Set();
            if (me) Object.values(map).forEach(days => Object.entries(days).forEach(([d, l]) => { if (l.some(e => keyOf(e.name) === me)) mineDays.add(Number(d)); }));

            let strip = '';
            for (let d = 1; d <= n; d++) {
                const dow = dayOfWeek(d);
                const cls = ['ds-day', dow === 5 ? 'fri' : '', dow === 6 ? 'sat' : '', d === today ? 'today' : '', d === selectedDay ? 'sel' : ''].filter(Boolean).join(' ');
                strip += `<button type="button" class="${cls}" onclick="selectDay(${d})" aria-label="${DAY_NAMES_AR[dow]} ${d}" ${d === selectedDay ? 'aria-current="date"' : ''}>
                    <span class="dn">${DAY_NAMES_AR[dow].replace('ال', '')}</span><span class="dd num">${d}</span>${mineDays.has(d) ? '<span class="mine-dot"></span>' : ''}
                </button>`;
            }
            const stripEl = document.getElementById('day-strip');
            stripEl.innerHTML = strip;
            centerInStrip(stripEl, stripEl.querySelector('.sel'));

            const dow = dayOfWeek(selectedDay);
            document.getElementById('day-title').innerHTML = `${DAY_NAMES_AR[dow]} <span class="num">${selectedDay}</span> ${esc(MONTH_SHORT_AR[currentMonth - 1])}${selectedDay === today ? '<span class="today-tag">اليوم</span>' : ''}`;

            const list = document.getElementById('day-list');
            if (!specs.length) {
                document.getElementById('day-count').textContent = '';
                list.innerHTML = '<div class="blank"><i class="fas fa-hospital"></i>لا توجد تخصصات مضافة لهذا المستشفى</div>';
                return;
            }
            const withDuty = [], empty = [];
            specs.forEach(spec => {
                const l = (map[spec.id] || {})[selectedDay] || [];
                if (l.length) withDuty.push({ spec, l, mine: !!me && l.some(e => keyOf(e.name) === me) });
                else empty.push(spec);
            });
            withDuty.sort((a, b) => b.mine - a.mine); // your own specialty first
            const people = withDuty.reduce((k, x) => k + x.l.length, 0);
            document.getElementById('day-count').textContent = people ? `${people} ${people === 1 ? 'خافر' : 'خفر'} · ${withDuty.length} تخصص` : '';

            if (!withDuty.length) {
                list.innerHTML = '<div class="blank view-anim"><i class="fas fa-calendar-xmark"></i>لا توجد خفارات مسجلة لهذا اليوم</div>';
                return;
            }
            list.innerHTML = `<div class="agenda view-anim">${withDuty.map(({ spec, l }) => {
                const src = cloneSource(spec);
                return `<div class="ag-card" style="--c:${safeColor(spec.color)}">
                    <div class="ag-spec"><span class="ic">${esc(spec.icon || '🏥')}</span><span>${esc(specLabel(spec))}</span>${src ? `<span class="clone">· من ${esc(src)}</span>` : ''}</div>
                    ${l.map((e, i) => docRow(e, spec, selectedDay, !!me && keyOf(e.name) === me, l.length > 1 ? `خفارة ${i + 1}` : '')).join('')}
                </div>`;
            }).join('')}</div>${empty.length ? `<div class="empty-note"><b>بدون خفارة مسجلة في هذا اليوم</b>${empty.map(s => `<span>${esc(specLabel(s))}</span>`).join('')}</div>` : ''}`;
        }

        // ================================================================
        // 2. ONE SPECIALTY (the month as a list)
        // ================================================================
        function selectSpecialty(specId) {
            selectedSpecialtyId = specId;
            renderSingleSpecialtyView();
            const today = todayInView();
            if (today) setTimeout(() => scrollToToday(today), 30);
            else window.scrollTo({ top: 0, behavior: 'auto' });
        }

        function shiftSpecialty(delta) {
            const specs = enabledSpecs();
            if (!specs.length) return;
            const i = Math.max(0, specs.findIndex(s => s.id === selectedSpecialtyId));
            selectSpecialty(specs[(i + delta + specs.length) % specs.length].id);
        }

        function renderSingleSpecialtyView() {
            const specs = enabledSpecs();
            const list = document.getElementById('single-list');
            const pills = document.getElementById('spec-pills-list');
            if (!specs.length) {
                pills.innerHTML = '';
                document.getElementById('single-spec-title').textContent = '';
                document.getElementById('single-spec-duties-count').textContent = '';
                list.innerHTML = '<div class="blank"><i class="fas fa-hospital"></i>لا توجد تخصصات مضافة لهذا المستشفى</div>';
                return;
            }
            if (!specs.some(s => s.id === selectedSpecialtyId)) selectedSpecialtyId = specs[0].id;
            const spec = specs.find(s => s.id === selectedSpecialtyId);
            const { map } = monthMap();
            const me = myKey();

            pills.innerHTML = specs.map(s => `<button type="button" class="spec-chip${s.id === selectedSpecialtyId ? ' sel' : ''}" style="--c:${safeColor(s.color)}" onclick="selectSpecialty('${esc(s.id)}')"><span class="sw"></span>${esc(specLabel(s))}</button>`).join('');
            centerInStrip(pills, pills.querySelector('.sel'));

            const days = map[spec.id] || {};
            const count = Object.values(days).reduce((k, l) => k + l.length, 0);
            const src = cloneSource(spec);
            document.getElementById('single-spec-title').textContent = `${spec.icon || ''} ${specLabel(spec)}${src ? ` · من ${src}` : ''}`.trim();
            document.getElementById('single-spec-duties-count').textContent = `${count} خفارة`;

            const n = getDaysInMonth(currentYear, currentMonth);
            const today = todayInView();
            let html = '';
            for (let d = 1; d <= n; d++) {
                const dow = dayOfWeek(d);
                const l = days[d] || [];
                const cls = ['mrow', dow === 5 ? 'fri' : '', dow === 6 ? 'sat' : '', d === today ? 'today' : ''].filter(Boolean).join(' ');
                html += `<div class="${cls}" id="m-day-${d}">
                    <div class="mday"><b class="num">${d}</b><span>${DAY_NAMES_AR[dow]}</span></div>
                    <div class="mdocs">${l.length ? l.map((e, i) => docRow(e, spec, d, !!me && keyOf(e.name) === me, l.length > 1 ? `خفارة ${i + 1}` : '')).join('') : '<span class="none">لا يوجد خفر مسجل</span>'}</div>
                </div>`;
            }
            list.innerHTML = `<div class="mlist view-anim">${html}</div>`;
        }

        // ================================================================
        // 3. FULL TABLE (days down, specialties across)
        // ================================================================
        function renderMatrixView() {
            const table = document.getElementById('schedule-matrix-table');
            const stats = document.getElementById('matrix-stats-text');
            const all = document.getElementById('grid-all-specs').checked;
            const { map, total } = monthMap();
            let specs = enabledSpecs();
            const withDuties = specs.filter(s => map[s.id]);
            if (!all && withDuties.length) specs = withDuties;
            const hiddenCount = enabledSpecs().length - specs.length;
            const roleLabel = currentScheduleRole === 'specialists' ? 'خفارة اختصاصي' : 'خفارة';
            stats.textContent = `${total} ${roleLabel} · ${specs.length} تخصص${hiddenCount ? ` (أُخفي ${hiddenCount} بلا خفارات)` : ''}`;

            if (!specs.length) {
                table.innerHTML = '<tbody><tr><td class="blank" style="border:0">لا توجد تخصصات مضافة لهذا المستشفى</td></tr></tbody>';
                return;
            }
            const me = myKey();
            const today = todayInView();
            let head = '<thead><tr><th class="dcol">اليوم</th>';
            specs.forEach(s => {
                const src = cloneSource(s);
                head += `<th style="--c:${safeColor(s.color)}"><span class="ic">${esc(s.icon || '🏥')}</span>${esc(specLabel(s))}${src ? `<br><small style="font-weight:600;opacity:.7">${esc(src)}</small>` : ''}</th>`;
            });
            head += '</tr></thead>';
            const n = getDaysInMonth(currentYear, currentMonth);
            let body = '<tbody>';
            for (let d = 1; d <= n; d++) {
                const dow = dayOfWeek(d);
                const cls = [dow === 5 ? 'fri' : '', dow === 6 ? 'sat' : '', d === today ? 'today' : ''].filter(Boolean).join(' ');
                body += `<tr id="g-day-${d}"${cls ? ` class="${cls}"` : ''}><td class="dcol"><b class="num">${d}</b><span>${DAY_NAMES_AR[dow]}</span></td>`;
                specs.forEach(s => {
                    const l = (map[s.id] || {})[d] || [];
                    body += `<td style="--c:${safeColor(s.color)}">${l.length ? l.map(e => {
                        const i = register(e, s, d);
                        const t = l.length > 1 ? shortDutyTime(e.dutyTime) : '';
                        const mine = !!me && keyOf(e.name) === me;
                        return `<button type="button" class="gname${mine ? ' mine' : ''}" onclick="openDuty(${i})">${esc(stripTitle(e.name))}${t ? `<small>${esc(t)}</small>` : ''}</button>`;
                    }).join('') : '<span class="gdash">—</span>'}</td>`;
                });
                body += '</tr>';
            }
            table.innerHTML = head + body + '</tbody>';
        }

        // ================================================================
        // 4. SEARCH: one doctor's duties this month
        // ================================================================
        function renderSearchView() {
            const { map } = monthMap();
            const specs = enabledSpecs();
            const me = myKey();
            const byDay = {};
            let count = 0;
            specs.forEach(spec => Object.entries(map[spec.id] || {}).forEach(([d, l]) => l.forEach(e => {
                if (!matchesSearch(e.name)) return;
                (byDay[d] = byDay[d] || []).push({ e, spec });
                count++;
            })));
            document.getElementById('search-title').textContent = `نتائج «${document.getElementById('doctor-search-input').value.trim()}»`;
            document.getElementById('search-count').textContent = `${count} خفارة في ${MONTH_SHORT_AR[currentMonth - 1]}`;
            const list = document.getElementById('search-list');
            const days = Object.keys(byDay).map(Number).sort((a, b) => a - b);
            if (!days.length) {
                list.innerHTML = '<div class="blank"><i class="fas fa-user-magnifying-glass"></i>لا توجد خفارات بهذا الاسم في هذا الشهر</div>';
                return;
            }
            const today = todayInView();
            list.innerHTML = days.map(d => `<div class="res-day">
                <h3>${DAY_NAMES_AR[dayOfWeek(d)]} <span class="num">${d}</span> ${esc(MONTH_SHORT_AR[currentMonth - 1])}${d === today ? '<span class="today-tag">اليوم</span>' : ''}</h3>
                <div class="mlist">${byDay[d].map(({ e, spec }) => docRow(e, spec, d, !!me && keyOf(e.name) === me, specLabel(spec))).join('')}</div>
            </div>`).join('');
        }

        // ================================================================
        // DUTY SHEET
        // ================================================================
        function openDuty(i) {
            const item = dutyRegistry[i];
            if (!item) return;
            const { entry, spec, d } = item;
            const name = (entry.name || '').trim();
            const phone = phoneOf(name);
            const dow = dayOfWeek(d);
            const k = keyOf(name);
            const hospName = currentHospital.name_ar || currentHospital.hospitalName || '';

            // The same doctor's other duties this month (any specialty).
            const { map } = monthMap();
            const others = [];
            enabledSpecs().forEach(s => Object.entries(map[s.id] || {}).forEach(([day, l]) => l.forEach(e => {
                if (keyOf(e.name) === k) others.push({ day: Number(day), s, e });
            })));
            others.sort((a, b) => a.day - b.day);

            document.getElementById('modal-duty-body').innerHTML = `
                <div class="sh-top" style="--c:${safeColor(spec.color)}">
                    <span class="doc-av">${esc(stripTitle(name).charAt(0) || '؟')}</span>
                    <div><h3>${esc(name)}</h3><p>${esc(spec.icon || '')} ${esc(specLabel(spec))}</p></div>
                    <button type="button" class="sh-close" onclick="closeDutyDetailModal()" aria-label="إغلاق"><i class="fas fa-xmark"></i></button>
                </div>
                <div class="sh-facts">
                    <div><span>اليوم</span><b>${DAY_NAMES_AR[dow]} <span class="num">${d}</span> ${esc(MONTH_SHORT_AR[currentMonth - 1])} <span class="num">${currentYear}</span></b></div>
                    ${entry.dutyTime ? `<div><span>الوقت</span><b class="num" dir="ltr">${esc(entry.dutyTime)}</b></div>` : ''}
                    <div><span>المستشفى</span><b>${esc(hospName)}</b></div>
                    ${phone ? `<div><span>الهاتف</span><b class="num" dir="ltr">${esc(phone)}</b></div>` : ''}
                </div>
                ${phone ? `<div class="sh-acts">
                    <a class="call" href="tel:${esc(phone)}"><i class="fas fa-phone"></i> اتصال</a>
                    <a class="wa" href="${waLink(phone)}" target="_blank" rel="noopener" aria-label="واتساب"><i class="fab fa-whatsapp"></i></a>
                </div>` : '<p class="sh-note">رقم الهاتف غير متوفر</p>'}
                ${others.length > 1 ? `<div class="sh-more"><h4>خفاراته في ${esc(MONTH_SHORT_AR[currentMonth - 1])} (${others.length})</h4><ul>
                    ${others.map(o => `<li class="${o.day === d && o.s.id === spec.id ? 'now' : ''}"><b>${DAY_NAMES_AR[dayOfWeek(o.day)]} <span class="num">${o.day}</span></b><span>${esc(specLabel(o.s))}</span></li>`).join('')}
                </ul></div>` : ''}`;
            document.getElementById('duty-detail-modal').classList.add('active');
        }

        function closeDutyDetailModal() {
            document.getElementById('duty-detail-modal').classList.remove('active');
        }
        document.addEventListener('keydown', e => { if (e.key === 'Escape') closeDutyDetailModal(); });

        // ================================================================
        // SWIPE: day agenda → next/previous day; one specialty → next/previous specialty
        // (finger to the left = next, as in the scheduler)
        // ================================================================
        function setupSwipe() {
            const bind = (el, onSwipe) => {
                let x0 = null, y0 = 0, t0 = 0;
                el.addEventListener('touchstart', e => {
                    if (e.touches.length !== 1 || e.target.closest('.strip')) { x0 = null; return; }
                    x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; t0 = Date.now();
                }, { passive: true });
                el.addEventListener('touchend', e => {
                    if (x0 === null) return;
                    const dx = e.changedTouches[0].clientX - x0, dy = e.changedTouches[0].clientY - y0;
                    x0 = null;
                    if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.6 && Date.now() - t0 < 700) onSwipe(dx > 0 ? -1 : 1);
                }, { passive: true });
            };
            bind(document.getElementById('day-list'), shiftDay);
            bind(document.getElementById('single-list'), shiftSpecialty);
        }

        window.addEventListener('DOMContentLoaded', initSchedule);
    </script>
</body>
</html>
