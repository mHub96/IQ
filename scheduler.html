                }
                
                track.innerHTML = html + '</div>';
                board.appendChild(track);
            });

            updateIndicators();
        }

        // ================================================================
        // TIME PICKER
        // ================================================================
        function openTimePicker(event, date, specialtyCode, slotIndex) {
            event.stopPropagation();
            event.preventDefault();
            
            closeTimePicker();
            
            var entries = (database.schedule || []).filter(function(scheduleEntry) { return scheduleEntry.date === date && scheduleEntry.specCode === specialtyCode; });
            if (entries.length <= 1) {
                showToast('⏰ Time is fixed to 24 hours (single resident)', 'info', 2000);
                return;
            }
            
            var specialtyColor = getSpecialtyColor(specialtyCode);
            if (slotIndex >= entries.length) return;
            
            var entry = entries[slotIndex];
            var startMinutes = 0;
            var endMinutes = TOTAL_MINUTES;
            
            if (entry.dutyTime) {
                var parsed = parseDutyTime(entry.dutyTime);
                if (parsed) {
                    startMinutes = parsed.start;
                    endMinutes = parsed.end;
                }
            }
            
            if (startMinutes === 0 && endMinutes === TOTAL_MINUTES) {
                var numberOfSlots = entries.length;
                var slotDuration = TOTAL_MINUTES / numberOfSlots;
                startMinutes = slotIndex * slotDuration;
                endMinutes = (slotIndex + 1) * slotDuration;
            }
            
            var popup = document.createElement('div');
            popup.className = 'time-picker-popup active';
            popup.style.setProperty('--specialty-color', specialtyColor);
            popup.style.borderColor = specialtyColor;
            popup.dataset.date = date;
            popup.dataset.spec = specialtyCode;
            popup.dataset.slot = slotIndex;
            
            var rect = event.target.getBoundingClientRect();
            var left = rect.left + rect.width / 2 - 140;
            var top = rect.bottom + 8;
            if (left < 10) left = 10;
            if (left + 300 > window.innerWidth) left = window.innerWidth - 310;
            if (top + 280 > window.innerHeight) top = rect.top - 280;
            
            popup.style.left = left + 'px';
            popup.style.top = top + 'px';
            
            function minutesToTimeParts(minutes) {
                var total = minutes + (DAY_START * 60);
                var hours = Math.floor(total / 60) % 24;
                var mins = total % 60;
                var ampm = hours >= 12 ? 'PM' : 'AM';
                var hours12 = hours % 12 || 12;
                return { hours: hours12, minutes: mins, ampm: ampm };
            }
            
            var startParts = minutesToTimeParts(startMinutes);
            var endParts = minutesToTimeParts(endMinutes);
            
            var hourOptions = [];
            for (var h = 1; h <= 12; h++) {
                hourOptions.push(h);
            }
            
            var minuteOptions = [];
            for (var m = 0; m < 60; m++) {
                minuteOptions.push(m);
            }
            
            var ampmOptions = ['AM', 'PM'];
            
            popup.innerHTML = `
                <div class="picker-title">⏱ Set Duty Time</div>
                <div style="display:flex; align-items:center; justify-content:center; gap:0.1rem; margin-bottom:0.3rem; flex-wrap:wrap;">
                    <div class="picker-col">
                        <select class="hours-select start-hours" style="min-width:46px;">
                            ${hourOptions.map(function(hour) { return '<option value="' + hour + '" ' + (hour === startParts.hours ? 'selected' : '') + '>' + String(hour).padStart(2, '0') + '</option>'; }).join('')}
                        </select>
                        <span class="picker-label">Hrs</span>
                    </div>
                    <span class="picker-colon">:</span>
                    <div class="picker-col">
                        <select class="minutes-select start-minutes" style="min-width:46px;">
                            ${minuteOptions.map(function(minute) { return '<option value="' + minute + '" ' + (minute === startParts.minutes ? 'selected' : '') + '>' + String(minute).padStart(2, '0') + '</option>'; }).join('')}
                        </select>
                        <span class="picker-label">Min</span>
                    </div>
                    <div class="picker-col">
                        <select class="ampm-select start-ampm" style="min-width:46px;">
                            ${ampmOptions.map(function(ampm) { return '<option value="' + ampm + '" ' + (ampm === startParts.ampm ? 'selected' : '') + '>' + ampm + '</option>'; }).join('')}
                        </select>
                        <span class="picker-label">AM/PM</span>
                    </div>
                    <span class="range-separator">→</span>
                    <div class="picker-col">
                        <select class="hours-select end-hours" style="min-width:46px;">
                            ${hourOptions.map(function(hour) { return '<option value="' + hour + '" ' + (hour === endParts.hours ? 'selected' : '') + '>' + String(hour).padStart(2, '0') + '</option>'; }).join('')}
                        </select>
                        <span class="picker-label">Hrs</span>
                    </div>
                    <span class="picker-colon">:</span>
                    <div class="picker-col">
                        <select class="minutes-select end-minutes" style="min-width:46px;">
                            ${minuteOptions.map(function(minute) { return '<option value="' + minute + '" ' + (minute === endParts.minutes ? 'selected' : '') + '>' + String(minute).padStart(2, '0') + '</option>'; }).join('')}
                        </select>
                        <span class="picker-label">Min</span>
                    </div>
                    <div class="picker-col">
                        <select class="ampm-select end-ampm" style="min-width:46px;">
                            ${ampmOptions.map(function(ampm) { return '<option value="' + ampm + '" ' + (ampm === endParts.ampm ? 'selected' : '') + '>' + ampm + '</option>'; }).join('')}
                        </select>
                        <span class="picker-label">AM/PM</span>
                    </div>
                </div>
                <div class="auto-redistribute-row">
                    <input type="checkbox" id="auto-redistribute-check" ${isDayAutoRedistributionEnabled(date, specialtyCode) ? 'checked' : ''}>
                    <label for="auto-redistribute-check">Auto-Redistribute</label>
                    <span class="auto-hint">(redistribute others around this)</span>
                </div>
                <div class="picker-actions">
                    <button class="button-cancel" onclick="closeTimePicker()">Cancel</button>
                    <button class="button-confirm" onclick="confirmTimePicker(this.closest('.time-picker-popup'))">Confirm</button>
                </div>
            `;
            document.body.appendChild(popup);
        }

        function confirmTimePicker(popup) {
            if (!popup) return;
            
            var date = popup.dataset.date;
            var specialtyCode = popup.dataset.spec;
            var slotIndex = parseInt(popup.dataset.slot);
            
            function timePartsToMinutes(hours, minutes, ampm) {
                var h = hours;
                if (ampm === 'PM' && h !== 12) h += 12;
                if (ampm === 'AM' && h === 12) h = 0;
                var total = h * 60 + minutes;
                if (total < DAY_START * 60) total += 24 * 60;
                return total - (DAY_START * 60);
            }
            
            var startHours = parseInt(popup.querySelector('.start-hours').value);
            var startMinutes = parseInt(popup.querySelector('.start-minutes').value);
            var startAmpm = popup.querySelector('.start-ampm').value;
            var endHours = parseInt(popup.querySelector('.end-hours').value);
            var endMinutes = parseInt(popup.querySelector('.end-minutes').value);
            var endAmpm = popup.querySelector('.end-ampm').value;
            var autoCheckbox = popup.querySelector('#auto-redistribute-check');

            function clockMinutes(hours, minutes, ampm) {
                var normalizedHours = hours;
                if (ampm === 'PM' && normalizedHours !== 12) normalizedHours += 12;
                if (ampm === 'AM' && normalizedHours === 12) normalizedHours = 0;
                return normalizedHours * 60 + minutes;
            }
            
            var startValue = timePartsToMinutes(startHours, startMinutes, startAmpm);
            var endValue = timePartsToMinutes(endHours, endMinutes, endAmpm);
            var useAuto = autoCheckbox ? autoCheckbox.checked : true;
            
            autoRedistributeEnabled = useAuto;
            
            if (startValue === endValue) {
                showToast('❌ Duty duration cannot be zero', 'error', 2000);
                return;
            }
            
            var entries = (database.schedule || []).filter(function(scheduleEntry) { return scheduleEntry.date === date && scheduleEntry.specCode === specialtyCode; });
            if (slotIndex >= entries.length) {
                closeTimePicker();
                return;
            }

            var startClock = clockMinutes(startHours, startMinutes, startAmpm);
            var endClock = clockMinutes(endHours, endMinutes, endAmpm);
            if (slotIndex === 0 && startClock < DAY_START * 60) {
                showToast('❌ The first resident cannot start before 08:00AM', 'error', 2500);
                return;
            }
            if (slotIndex === entries.length - 1 && endClock > DAY_START * 60) {
                showToast('❌ The last resident cannot end after 08:00AM', 'error', 2500);
                return;
            }

            var dayTimeKey = getDayTimeKey(date, specialtyCode);
            if (useAuto) {
                delete manualTimeDays[dayTimeKey];
            } else {
                manualTimeDays[dayTimeKey] = true;
            }
            
            var entry = entries[slotIndex];
            entry.dutyTime = formatDutyTime(startValue, endValue);
            
            var result = redistributeDayTimes(date, specialtyCode, slotIndex, useAuto);
            
            closeTimePicker();
            
            // Set pending focus for restoration
            pendingFocusDate = date;
            pendingFocusSpec = specialtyCode;
            pendingFocusSlot = slotIndex;
            pendingFocusUsed = false;
            
            refreshView();
            
            if (useAuto) {
                if (result.hasGaps && result.gaps.length > 0) {
                    var gapText = result.gaps.map(function(gap) { 
                        return minutesToTimeString(gap.start) + ' - ' + minutesToTimeString(gap.end);
                    }).join(', ');
                    showToast('⚠️ Gaps detected: ' + gapText, 'error', 3000);
                } else {
                    showToast('✅ Time updated and redistributed', 'success', 1500);
                }
            } else {
                if (result.hasGaps && result.gaps.length > 0) {
                    var gapText2 = result.gaps.map(function(gap) { 
                        return minutesToTimeString(gap.start) + ' - ' + minutesToTimeString(gap.end);
                    }).join(', ');
                    showToast('⚠️ Gaps detected: ' + gapText2, 'error', 3000);
                } else {
                    showToast('✅ Time updated - no gaps', 'success', 1500);
                }
            }
        }

        // ================================================================
        // ADD / DELETE SLOT
        // ================================================================
        function addSlot(date, specialtyCode) {
            var entries = (database.schedule || []).filter(function(scheduleEntry) { return scheduleEntry.date === date && scheduleEntry.specCode === specialtyCode; });
            var newIndex = entries.length;

            if (entries.length === 0) {
                database.schedule.push({
                    date: date,
                    specCode: specialtyCode,
                    name: "",
                    VisitCount: 0,
                    dutyTime: "",
                    dutySlot: 0
                });
                newIndex = 1;
            }
            
            var newEntry = {
                date: date,
                specCode: specialtyCode,
                name: "",
                VisitCount: 0,
                dutyTime: "",
                dutySlot: newIndex
            };
            database.schedule.push(newEntry);
            
            redistributeDayTimes(date, specialtyCode, null, isDayAutoRedistributionEnabled(date, specialtyCode));
            
            pendingFocusDate = date;
            pendingFocusSpec = specialtyCode;
            pendingFocusSlot = newIndex;
            pendingFocusUsed = false;
            
            refreshView();
            
            setTimeout(function() {
                var input = document.querySelector('input[data-date="' + date + '"][data-spec="' + specialtyCode + '"][data-slot="' + newIndex + '"]');
                if (input) {
                    input.focus();
                    input.select();
                    input.scrollIntoView({ behavior: 'smooth', block: 'center' });
                }
            }, 150);
            
            showToast('✅ New resident added - time redistributed', 'success', 2000);
        }

        function deleteSlot(date, specialtyCode, slotIndex) {
            var entries = (database.schedule || []).filter(function(scheduleEntry) { return scheduleEntry.date === date && scheduleEntry.specCode === specialtyCode; });
            if (slotIndex >= entries.length) return;
            
            var entryToRemove = entries[slotIndex];
            var index = database.schedule.indexOf(entryToRemove);
            if (index !== -1) database.schedule.splice(index, 1);
            
            var remaining = (database.schedule || []).filter(function(scheduleEntry) { return scheduleEntry.date === date && scheduleEntry.specCode === specialtyCode; });
            remaining.forEach(function(entry, idx) { entry.dutySlot = idx; });
            
            if (remaining.length > 0) {
                redistributeDayTimes(date, specialtyCode, null, isDayAutoRedistributionEnabled(date, specialtyCode));
            }
            
            pendingFocusDate = date;
            pendingFocusSpec = specialtyCode;
            pendingFocusSlot = Math.min(slotIndex, remaining.length - 1);
            pendingFocusUsed = false;
            
            refreshView();
            showToast('🗑️ Resident deleted - time redistributed', 'info', 2000);
        }

        // ================================================================
        // RENDER DATA
        // ================================================================
        function renderData() {
            var picker = document.getElementById('month-picker');
            if (!picker) return;
            var parts = picker.value.split('-');
            var year = parts[0];
            var month = parts[1];
            
            var inputs = document.querySelectorAll('.cell-input');
            inputs.forEach(function(input) {
                var date = input.dataset.date;
                var specialtyCode = input.dataset.spec;
                var slotIndex = parseInt(input.dataset.slot) || 0;
                
                if (date && date.endsWith(month + '/' + year)) {
                    var entries = (database.schedule || []).filter(function(scheduleEntry) { return scheduleEntry.date === date && scheduleEntry.specCode === specialtyCode; });
                    if (slotIndex < entries.length) {
                        var entry = entries[slotIndex];
                        var isValidName = nameData[specialtyCode]?.includes(entry.name) || false;
                        input.value = entry.name || '';
                        if (entry.name) {
                            if (!isValidName && entry.name.trim() !== '') {
                                input.classList.add('invalid-name');
                                input.classList.remove('prefilled');
                            } else {
                                input.classList.add('prefilled');
                                input.classList.remove('invalid-name');
                            }
                        } else {
                            input.classList.remove('prefilled', 'invalid-name');
                        }
                    } else {
                        input.value = '';
                        input.classList.remove('prefilled', 'invalid-name');
                    }
                }
            });
        }

        // ================================================================
        // REFRESH VIEW - FIXED: Clear pending focus after use
        // ================================================================
        function refreshView() {
            if (refreshScheduled) return;
            refreshScheduled = true;
            
            isRefreshing = true;
            
            requestAnimationFrame(function() {
                generateBoard();
                renderData();
                
                if (currentView === 'single') {
                    var container = document.getElementById('board-container');
                    var tracks = container.querySelectorAll('.specialty-track');
                    tracks.forEach(function(track, index) {
                        if (index === currentTrackIndex) {
                            track.classList.remove('hidden-track', 'slide-out-left', 'slide-out-right');
                            track.style.display = '';
                        } else {
                            track.classList.add('hidden-track');
                            track.style.display = 'none';
                        }
                    });
                }
                updateIndicators();
                
                // Only restore focus if we have pending focus AND it hasn't been used yet
                if (pendingFocusDate && pendingFocusSpec !== null && pendingFocusSlot !== null && !pendingFocusUsed) {
                    setTimeout(function() {
                        var targetInput = document.querySelector(
                            'input[data-date="' + pendingFocusDate + '"][data-spec="' + pendingFocusSpec + '"][data-slot="' + pendingFocusSlot + '"]'
                        );
                        if (targetInput) {
                            targetInput.focus();
                            targetInput.select();
                            targetInput.scrollIntoView({ behavior: 'auto', block: 'center' });
                        }
                        // Clear pending focus data after use to prevent blur from triggering again
                        pendingFocusDate = null;
                        pendingFocusSpec = null;
                        pendingFocusSlot = null;
                        pendingFocusUsed = true;
                        isRefreshing = false;
                        refreshScheduled = false;
                    }, 100);
                } else {
                    // Always clear pending focus if no restore needed, to avoid stale data
                    pendingFocusDate = null;
                    pendingFocusSpec = null;
                    pendingFocusSlot = null;
                    pendingFocusUsed = true;
                    isRefreshing = false;
                    refreshScheduled = false;
                }
            });
        }

        // ================================================================
        // INPUT HANDLING
        // ================================================================
        function handleAutocomplete(element, specialtyId, uniqueId) {
            var ghost = document.getElementById('ghost-' + uniqueId);
            var value = element.value;
            ghost.innerHTML = "";
            ghost.removeAttribute('data-full');
            element.classList.remove('prefilled', 'invalid-name');
            
            if (!value.trim()) { 
                element.classList.remove('new-entry'); 
                return; 
            }
            element.classList.add('new-entry');

            var validNames = nameData[specialtyId] || [];
            if (validNames.length > 0) {
                var match = validNames.find(function(name) {
                    var nameClean = name.toLowerCase().replace(/^د\.\s*/, "").trim();
                    var valueClean = value.toLowerCase().replace(/^د\.\s*/, "").trim();
                    return name.toLowerCase().startsWith(value.toLowerCase()) || nameClean.startsWith(valueClean);
                });
                if (match) {
                    ghost.setAttribute('data-full', match);
                    var display = value.startsWith("د.") ? match : match.replace(/^د\.\s*/, "");
                    if (display.toLowerCase().startsWith(value.toLowerCase())) {
                        ghost.innerHTML = '<span class="ghost-offset">' + value + '</span><span class="ghost-suggestion-bright">' + display.substring(value.length) + '</span>';
                    } else { 
                        ghost.innerHTML = '<span class="ghost-suggestion">' + display + '</span>';
                    }
                } else {
                    var exactMatch = validNames.find(function(name) { return name.toLowerCase() === value.toLowerCase(); });
                    if (exactMatch) {
                        ghost.setAttribute('data-full', exactMatch);
                        ghost.innerHTML = '<span class="ghost-suggestion-bright">' + exactMatch + '</span>';
                    }
                }
            }
        }

        function handleKeys(event, element, uniqueId) {
            if (event.key === "Enter") {
                event.preventDefault();
                event.stopPropagation();
                
                var date = element.dataset.date;
                var specialtyCode = element.dataset.spec;
                var slotIndex = parseInt(element.dataset.slot) || 0;
                
                var nextCell = getNextCellInfo(date, specialtyCode, slotIndex);
                
                var ghost = document.getElementById('ghost-' + uniqueId);
                var full = ghost ? ghost.getAttribute('data-full') : null;
                if (full && element.value.trim() !== full) {
                    element.value = full;
                    element.classList.add('new-entry');
                    element.classList.remove('invalid-name');
                    if (ghost) ghost.innerHTML = "";
                    if (nextCell) {
                        pendingFocusDate = nextCell.date;
                        pendingFocusSpec = nextCell.spec;
                        pendingFocusSlot = nextCell.slot;
                        pendingFocusUsed = false;
                    }
                    saveEntry(element, true);
                } else if (element.value.trim()) {
                    if (nextCell) {
                        pendingFocusDate = nextCell.date;
                        pendingFocusSpec = nextCell.spec;
                        pendingFocusSlot = nextCell.slot;
                        pendingFocusUsed = false;
                    }
                    saveEntry(element, true);
                } else {
                    moveToNextCell(date, specialtyCode, slotIndex);
                }
                return false;
            }
        }
        
        function getNextCellInfo(date, specialtyCode, currentSlot) {
            var allInputs = Array.from(document.querySelectorAll('input[data-spec="' + specialtyCode + '"]'));
            var currentInput = allInputs.find(function(input) { 
                return input.dataset.date === date && parseInt(input.dataset.slot) === currentSlot;
            });
            if (!currentInput) return null;
            var currentIndex = allInputs.indexOf(currentInput);
            if (currentIndex + 1 < allInputs.length) {
                var nextInput = allInputs[currentIndex + 1];
                return {
                    date: nextInput.dataset.date,
                    spec: nextInput.dataset.spec,
                    slot: parseInt(nextInput.dataset.slot)
                };
            }
            return null;
        }

        function moveToNextCell(date, specialtyCode, currentSlot) {
            var allInputs = Array.from(document.querySelectorAll('input[data-spec="' + specialtyCode + '"]'));
            var currentInput = allInputs.find(function(input) { 
                return input.dataset.date === date && parseInt(input.dataset.slot) === currentSlot;
            });
            if (!currentInput) return;
            var currentIndex = allInputs.indexOf(currentInput);
            if (currentIndex + 1 < allInputs.length) {
                var nextInput = allInputs[currentIndex + 1];
                nextInput.focus();
                nextInput.select();
                nextInput.scrollIntoView({ behavior: 'smooth', block: 'center' });
                return;
            }
            if (currentInput) {
                currentInput.focus();
                currentInput.select();
            }
        }

        function toggleMenu(event, uniqueId, specialtyId) {
            event.stopPropagation();
            var menu = document.getElementById('menu-' + uniqueId);
            var isOpen = menu.style.display === "block";
            closeAllMenus();
            if (!isOpen) {
                var specialtyColor = getSpecialtyColor(specialtyId);
                menu.style.borderColor = specialtyColor;
                var validNames = nameData[specialtyId] || [];
                if (validNames.length === 0) {
                    menu.innerHTML = '<div style="color:#5d6f83;font-size:0.55rem;text-align:center;padding:0.4rem;">No residents</div>';
                } else {
                    menu.innerHTML = validNames.map(function(name) { 
                        return '<div onmousedown="selectName(\'' + uniqueId + '\', \'' + name + '\')">' + name + '</div>';
                    }).join('');
                }
                menu.style.display = "block";
            }
        }

        function selectName(uniqueId, name) {
            var input = document.getElementById('input-' + uniqueId);
            if (input) {
                input.value = name;
                input.classList.add('new-entry');
                input.classList.remove('invalid-name');
                var ghost = document.getElementById('ghost-' + uniqueId);
                if (ghost) ghost.innerHTML = "";
                saveEntry(input);
                var date = input.dataset.date;
                var specialtyCode = input.dataset.spec;
                var slotIndex = parseInt(input.dataset.slot) || 0;
                setTimeout(function() {
                    moveToNextCell(date, specialtyCode, slotIndex);
                }, 100);
            }
            closeAllMenus();
        }

        function handleBlur(uniqueId) {
            // If we are refreshing or there's a pending focus that hasn't been used yet, skip blur handling
            if (isRefreshing || (pendingFocusDate !== null && !pendingFocusUsed)) {
                return;
            }
            
            setTimeout(function() {
                var ghost = document.getElementById('ghost-' + uniqueId);
                var input = document.getElementById('input-' + uniqueId);
                if (ghost && ghost.getAttribute('data-full') && input && input.value !== "") {
                    var fullName = ghost.getAttribute('data-full');
                    input.value = fullName;
                    input.classList.add('new-entry');
                    input.classList.remove('invalid-name');
                    saveEntry(input);
                } else if (input && input.value.trim() !== "") {
                    var specialtyCode = input.dataset.spec;
                    var validNames = nameData[specialtyCode] || [];
                    var isValid = validNames.some(function(name) { return name.toLowerCase() === input.value.trim().toLowerCase(); });
                    if (!isValid) {
                        input.classList.add('invalid-name');
                        input.classList.remove('prefilled', 'new-entry');
                        showToast('⚠️ "' + input.value.trim() + '" not found', 'error', 2000);
                        setTimeout(function() {
                            if (input && input.classList.contains('invalid-name')) {
                                input.value = '';
                                input.classList.remove('invalid-name');
                                var date = input.dataset.date;
                                var specialtyCode = input.dataset.spec;
                                var slotIndex = parseInt(input.dataset.slot) || 0;
                                var entries = (database.schedule || []).filter(function(scheduleEntry) { return scheduleEntry.date === date && scheduleEntry.specCode === specialtyCode; });
                                if (slotIndex < entries.length && entries[slotIndex].name === input.value) {
                                    entries[slotIndex].name = '';
                                    refreshView();
                                }
                            }
                        }, 3000);
                    } else {
                        input.classList.remove('invalid-name');
                        input.classList.add('prefilled');
                        saveEntry(input);
                    }
                }
                if (ghost) ghost.innerHTML = "";
            }, 300);
        }

        // ================================================================
        // SAVE ENTRY
        // ================================================================
        function saveEntry(input, refreshAfterSave) {
            var date = input.dataset.date;
            var specialtyCode = input.dataset.spec;
            var slotIndex = parseInt(input.dataset.slot) || 0;
            var name = input.value.trim();
            
            if (!name) return;
            
            var validNames = nameData[specialtyCode] || [];
            if (!validNames.some(function(n) { return n.toLowerCase() === name.toLowerCase(); })) {
                input.classList.add('invalid-name');
                input.classList.remove('prefilled', 'new-entry');
                showToast('⚠️ "' + name + '" not found', 'error', 2000);
                setTimeout(function() {
                    if (input && input.classList.contains('invalid-name')) {
                        input.value = '';
                        input.classList.remove('invalid-name');
                        var entries = (database.schedule || []).filter(function(scheduleEntry) { return scheduleEntry.date === date && scheduleEntry.specCode === specialtyCode; });
                        if (slotIndex < entries.length && entries[slotIndex].name === name) {
                            entries[slotIndex].name = '';
                            refreshView();
                        }
                    }
                }, 2500);
                return;
            }
            
            var entries = (database.schedule || []).filter(function(scheduleEntry) { return scheduleEntry.date === date && scheduleEntry.specCode === specialtyCode; });
            if (slotIndex >= entries.length) {
                var newEntry = {
                    date: date,
                    specCode: specialtyCode,
                    name: name,
                    VisitCount: 0,
                    dutyTime: "",
                    dutySlot: slotIndex
                };
                database.schedule.push(newEntry);
                redistributeDayTimes(date, specialtyCode, null, isDayAutoRedistributionEnabled(date, specialtyCode));
            } else {
                entries[slotIndex].name = name;
                redistributeDayTimes(date, specialtyCode, null, isDayAutoRedistributionEnabled(date, specialtyCode));
            }
            
            input.classList.remove('invalid-name', 'new-entry');
            input.classList.add('prefilled');
            
            if (refreshAfterSave) {
                if (pendingFocusUsed) {
                    pendingFocusDate = date;
                    pendingFocusSpec = specialtyCode;
                    pendingFocusSlot = slotIndex;
                    pendingFocusUsed = false;
                }
                refreshView();
            }
        }

        // ================================================================
        // SAVE TO GITHUB
        // ================================================================
        async function saveToGithub() {
            var button = document.getElementById('synchronize-button');
            var origContent = button ? button.innerHTML : '';
            if (button) {
                button.disabled = true;
                button.innerHTML = '<i class="fas fa-spinner fa-spin"></i> <span>جاري الحفظ...</span>';
            }

            try {
                if (window.Hub) {
                    var activeHosp = window.Hub.getActiveHospital();
                    if (activeHosp) {
                        activeHosp.schedule = database.schedule;
                        await window.Hub.saveDatabase("Sync Schedule for " + (activeHosp.name_ar || activeHosp.hospitalName));
                        if (button) button.innerHTML = '<i class="fas fa-check"></i> <span>تم الحفظ!</span>';
                        showToast('✅ تم حفظ جدول الخفارات بنجاح في السيرفر', 'success');
                    }
                }
            } catch (error) { 
                console.error("Save Error:", error);
                if (button) button.innerHTML = '<i class="fas fa-triangle-exclamation"></i> <span>فشل الحفظ</span>';
                showToast('❌ خطأ في حفظ البيانات في السيرفر', 'error');
            }
            setTimeout(function() { 
                if (button) {
                    button.disabled = false;
                    button.innerHTML = '<i class="fas fa-cloud-arrow-up"></i> <span id="save-btn-text">حفظ الجدول</span>'; 
                }
            }, 2200);
        }

        // ================================================================
        // TOAST NOTIFICATIONS
        // ================================================================
        var toastTimeout = null;

        function showToast(message, type, duration) {
            type = type || 'info';
            duration = duration || 2500;
            if (toastTimeout) {
                clearTimeout(toastTimeout);
                var existing = document.querySelector('.toast-container');
                if (existing) existing.remove();
            }
            
            var container = document.createElement('div');
            container.className = 'toast-container';
            var backgroundColors = {
                success: '#10b981',
                error: '#ef4444',
                info: '#3b82f6'
            };
            container.style.background = backgroundColors[type] || '#3b82f6';
            container.textContent = message;
            document.body.appendChild(container);
            
            toastTimeout = setTimeout(function() {
                container.style.opacity = '0';
                container.style.transform = 'translateX(-50%) translateY(-20px)';
                setTimeout(function() {
                    if (container.parentElement) container.remove();
                    toastTimeout = null;
                }, 300);
            }, duration);
        }

        function promptAutoFixGaps(event, date, specialtyCode) {
            event.stopPropagation();
            document.querySelectorAll('.gap-fix-popup').forEach(function(popup) { popup.remove(); });

            var popup = document.createElement('div');
            popup.className = 'gap-fix-popup';
            popup.innerHTML = `
                <p>Timing issues detected. Replace the manual times with an equal 24-hour distribution?</p>
                <div class="gap-fix-popup-actions">
                    <button class="gap-fix-cancel" onclick="this.closest('.gap-fix-popup').remove()">Cancel</button>
                    <button class="gap-fix-confirm" onclick="fixDayGaps('${date}', '${specialtyCode}')">Fix gaps</button>
                </div>
            `;

            var rect = event.currentTarget.getBoundingClientRect();
            popup.style.left = Math.max(10, Math.min(rect.left, window.innerWidth - 290)) + 'px';
            popup.style.top = Math.min(rect.bottom + 6, window.innerHeight - 150) + 'px';
            document.body.appendChild(popup);
        }

        function fixDayGaps(date, specialtyCode) {
            var popup = document.querySelector('.gap-fix-popup');
            if (popup) popup.remove();

            var entries = (database.schedule || []).filter(function(scheduleEntry) {
                return scheduleEntry.date === date && scheduleEntry.specCode === specialtyCode;
            });
            if (entries.length <= 1) return;

            delete manualTimeDays[getDayTimeKey(date, specialtyCode)];

            var slotDuration = TOTAL_MINUTES / entries.length;
            entries.sort(function(a, b) { return (a.dutySlot || 0) - (b.dutySlot || 0); });
            entries.forEach(function(entry, index) {
                entry.dutySlot = index;
                entry.dutyTime = formatDutyTime(
                    Math.round(index * slotDuration),
                    Math.round((index + 1) * slotDuration)
                );
            });

            refreshView();
            showToast('✅ Gaps fixed and time distributed evenly', 'success', 2200);
        }

        // ================================================================
        // EXPOSE TO GLOBAL SCOPE
        // ================================================================
        window.switchView = switchView;
        window.navigateTrack = navigateTrack;
        window.addSlot = addSlot;
        window.deleteSlot = deleteSlot;
        window.openTimePicker = openTimePicker;
        window.confirmTimePicker = confirmTimePicker;
        window.closeTimePicker = closeTimePicker;
        window.saveToGithub = saveToGithub;
        window.refreshView = refreshView;
        window.handleAutocomplete = handleAutocomplete;
        window.handleKeys = handleKeys;
        window.toggleMenu = toggleMenu;
        window.selectName = selectName;
        window.handleBlur = handleBlur;
        window.closeAllMenus = closeAllMenus;
        window.showToast = showToast;
        window.promptAutoFixGaps = promptAutoFixGaps;
        window.fixDayGaps = fixDayGaps;
        window.redistributeDayTimes = redistributeDayTimes;
        window.autoRedistributeEnabled = autoRedistributeEnabled;
        window.navigateMonth = navigateMonth;
        window.onMonthPickerChange = onMonthPickerChange;
        window.switchToSpecialtyIndex = switchToSpecialtyIndex;
        window.populateSpecialtyQuickSelect = populateSpecialtyQuickSelect;
        window.syncSchedulerTheme = syncSchedulerTheme;
    </script>
    <script src="pwa.js"></script>
    <script src="./hub-core.js"></script>
