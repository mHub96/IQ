<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="manifest" href="./manifest.webmanifest" />
    <title>HOSPITAL SCHEDULER 🇮🇶</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>tailwind.config = { darkMode: 'class' };</script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,600;14..32,700;14..32,800&family=IBM+Plex+Sans+Arabic:wght@400;600;700;800&family=JetBrains+Mono:wght@600&display=swap" rel="stylesheet">
    <style>
        /* ----- RESET & BASE ----- */
        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
        }

        :root {
            /* Light Theme (Default / Day Mode) */
            --background-color: #f1f5f9;
            --card-background-color: #ffffff;
            --card-hover-background-color: #f8fafc;
            --border-subtle: #cbd5e1;
            --border-focus: #94a3b8;
            --text-primary-color: #0f172a;
            --text-secondary-color: #334155;
            --text-muted-color: #64748b;
            --slot-bg: #f8fafc;
            --slot-border: #e2e8f0;
            --cell-input-color: #0f172a;
            --cell-input-placeholder: #94a3b8;
            --ghost-text-color: #64748b;
            --navigation-bg: rgba(255, 255, 255, 0.96);
            --navigation-border: #e2e8f0;
            --navigation-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
            --day-box-bg: rgba(0, 0, 0, 0.015);
            --day-box-border: #e2e8f0;
            --day-box-weekend: rgba(241, 245, 249, 0.9);
            --popup-bg: #ffffff;
            --popup-border: #cbd5e1;
            --popup-shadow: 0 20px 40px rgba(0, 0, 0, 0.15);
            --custom-menu-bg: #ffffff;
            --custom-menu-item-color: #1e293b;
            --custom-menu-item-hover-bg: #f1f5f9;
            --navigation-height: 56px;
            --card-radius: 1.5rem;
            --input-radius: 0.8rem;
        }

        body.dark {
            /* Dark Theme (Night Mode) */
            --background-color: #0b0e13;
            --card-background-color: #141a24;
            --card-hover-background-color: #1c2432;
            --border-subtle: rgba(255, 255, 255, 0.08);
            --border-focus: rgba(255, 255, 255, 0.18);
            --text-primary-color: #f8fafc;
            --text-secondary-color: #cbd5e1;
            --text-muted-color: #94a3b8;
            --slot-bg: rgba(255, 255, 255, 0.03);
            --slot-border: rgba(255, 255, 255, 0.06);
            --cell-input-color: #f8fafc;
            --cell-input-placeholder: rgba(255, 255, 255, 0.2);
            --ghost-text-color: rgba(255, 255, 255, 0.38);
            --navigation-bg: rgba(18, 22, 30, 0.96);
            --navigation-border: rgba(255, 255, 255, 0.08);
            --navigation-shadow: 0 4px 30px rgba(0, 0, 0, 0.5);
            --day-box-bg: rgba(255, 255, 255, 0.015);
            --day-box-border: transparent;
            --day-box-weekend: rgba(255, 255, 255, 0.03);
            --popup-bg: #1a2230;
            --popup-border: rgba(255, 255, 255, 0.15);
            --popup-shadow: 0 20px 60px rgba(0, 0, 0, 0.8);
            --custom-menu-bg: #1a2230;
            --custom-menu-item-color: #c8d4e3;
            --custom-menu-item-hover-bg: rgba(255, 255, 255, 0.08);
        }

        body {
            font-family: 'IBM Plex Sans Arabic', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--background-color);
            color: var(--text-secondary-color);
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            transition: background 0.3s ease, color 0.3s ease;
        }

        #application-wrapper {
            display: flex;
            flex-direction: column;
            flex: 1;
            min-height: 0;
            overflow: hidden;
            position: relative;
            width: 100%;
        }

        /* ----- NAVIGATION BAR ----- */
        .navigation-bar {
            position: relative;
            z-index: 100;
            flex-shrink: 0;
            width: 100%;
            min-height: 56px;
            height: auto;
            padding: 0.55rem 1.25rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--navigation-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--navigation-border);
            box-shadow: var(--navigation-shadow);
            gap: 0.75rem;
            flex-wrap: wrap;
            transition: background 0.3s ease, border-color 0.3s ease;
        }

        .navigation-brand {
            display: flex;
            align-items: center;
            gap: 0.55rem;
        }

        .navigation-brand .brand-badge {
            width: 32px;
            height: 32px;
            border-radius: 10px;
            background: rgba(212, 175, 55, 0.12);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
            border: 1px solid rgba(212, 175, 55, 0.25);
            flex-shrink: 0;
        }

        .navigation-brand h1 {
            font-weight: 800;
            font-size: 1.05rem;
            letter-spacing: -0.02em;
            color: var(--text-primary-color);
            white-space: nowrap;
        }

        .navigation-brand span {
            font-size: 1.1rem;
        }

        .navigation-actions {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            flex-wrap: wrap;
        }

        /* View Mode Selector */
        .view-selector {
            display: flex;
            background: var(--card-background-color);
            border-radius: 2rem;
            padding: 0.15rem;
            border: 1.5px solid var(--border-subtle);
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.04);
            transition: all 0.2s ease;
        }

        body.dark .view-selector {
            background: rgba(255, 255, 255, 0.04);
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.3);
        }

        .view-button {
            padding: 0.32rem 0.85rem;
            border-radius: 1.5rem;
            border: none;
            background: transparent;
            color: var(--text-muted-color);
            font-size: 0.72rem;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s ease;
            font-family: inherit;
            display: inline-flex;
            align-items: center;
            gap: 0.35rem;
        }

        .view-button:hover {
            color: var(--text-primary-color);
        }

        .view-button.active {
            background: linear-gradient(135deg, #0f766e, #0d9488);
            color: #ffffff;
            box-shadow: 0 2px 8px rgba(15, 118, 110, 0.25);
        }

        body.dark .view-button.active {
            background: linear-gradient(135deg, #d4af37, #b8942e);
            color: #0b0e13;
            box-shadow: 0 2px 8px rgba(212, 175, 55, 0.25);
        }

        /* Month Navigation Controller */
        .month-control-group {
            display: flex;
            align-items: center;
            gap: 0.2rem;
            background: var(--card-background-color);
            border: 1.5px solid var(--border-subtle);
            padding: 0.18rem 0.3rem;
            border-radius: 2rem;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
            transition: all 0.2s ease;
        }

        body.dark .month-control-group {
            background: rgba(255, 255, 255, 0.04);
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.3);
        }

        .month-control-group:hover, .month-control-group:focus-within {
            border-color: #d4af37;
        }

        .month-nav-btn {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            border: none;
            background: transparent;
            color: var(--text-secondary-color);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 0.75rem;
            transition: all 0.15s ease;
        }

        .month-nav-btn:hover {
            background: rgba(212, 175, 55, 0.15);
            color: #d4af37;
            transform: scale(1.08);
        }

        .month-nav-btn:active {
            transform: scale(0.95);
        }

        .month-input-wrapper {
            display: flex;
            align-items: center;
            gap: 0.35rem;
            padding: 0 0.25rem;
        }

        .month-input-wrapper .month-icon {
            font-size: 0.85rem;
            color: #d4af37;
        }

        .month-picker {
            background: transparent;
            border: none;
            color: var(--text-primary-color);
            padding: 0.2rem 0.25rem;
            font-weight: 700;
            font-size: 0.8rem;
            cursor: pointer;
            font-family: inherit;
            outline: none;
        }

        body:not(.dark) .month-picker::-webkit-calendar-picker-indicator {
            filter: none;
            cursor: pointer;
        }

        body.dark .month-picker::-webkit-calendar-picker-indicator {
            filter: invert(0.85);
            cursor: pointer;
        }

        /* Save Button */
        .synchronize-button {
            background: linear-gradient(135deg, #d4af37, #f59e0b);
            color: #0b0e13;
            padding: 0.45rem 1.15rem;
            border-radius: 2rem;
            font-weight: 800;
            font-size: 0.78rem;
            letter-spacing: 0.02em;
            border: none;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 4px 14px rgba(212, 175, 55, 0.3);
            cursor: pointer;
            white-space: nowrap;
            font-family: inherit;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }

        .synchronize-button:hover {
            transform: translateY(-1px) scale(1.02);
            box-shadow: 0 6px 20px rgba(212, 175, 55, 0.45);
            filter: brightness(1.08);
        }

        .synchronize-button:active {
            transform: translateY(1px) scale(0.98);
        }

        /* ----- BOARD CONTAINER ----- */
        .board-container {
            position: relative;
            flex: 1;
            min-height: 0;
            height: 100%;
            width: 100%;
            display: flex;
            gap: 1.2rem;
            padding: 1.1rem 1.4rem 1.4rem;
            overflow-x: auto;
            overflow-y: hidden;
            align-items: stretch;
            box-sizing: border-box;
            scroll-behavior: smooth;
            background: var(--background-color);
        }

        .board-container.all-view {
            overflow-x: auto;
            overflow-y: hidden;
            justify-content: flex-start;
        }

        .board-container.single-view {
            overflow: hidden;
            justify-content: center;
            padding: 1rem 0.5rem 1.2rem 0.5rem;
            touch-action: none;
        }

        .board-container::-webkit-scrollbar {
            height: 6px;
        }
        .board-container::-webkit-scrollbar-track {
            background: transparent;
        }
        .board-container::-webkit-scrollbar-thumb {
            background: var(--border-subtle);
            border-radius: 20px;
        }

        /* Specialty Tracks */
        .specialty-track {
            flex: 0 0 auto;
            width: 340px;
            background: var(--card-background-color);
            border-radius: var(--card-radius);
            display: flex;
            flex-direction: column;
            height: 100%;
            max-height: 100%;
            border: 1.5px solid var(--border-subtle);
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.06);
            transition: border-color 0.2s, box-shadow 0.2s, transform 0.3s ease, opacity 0.3s ease;
            overflow: hidden;
            min-width: 280px;
            max-width: 420px;
        }

        body.dark .specialty-track {
            box-shadow: 0 20px 40px -20px rgba(0, 0, 0, 0.8);
        }

        .board-container.all-view .specialty-track {
            flex: 0 0 320px;
            width: 320px;
            min-width: 260px;
            max-width: 380px;
            height: 100%;
        }

        .board-container.single-view .specialty-track {
            flex: 0 0 94%;
            max-width: 560px;
            min-width: 280px;
            width: 94%;
            height: 100%;
            transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.3s ease;
        }

        .specialty-track:hover {
            border-color: var(--specialty-color);
            box-shadow: 0 12px 36px rgba(0, 0, 0, 0.1), 0 0 20px -8px var(--specialty-color);
        }

        body.dark .specialty-track:hover {
            border-color: rgba(255, 255, 255, 0.15);
            box-shadow: 0 20px 40px -20px rgba(0, 0, 0, 0.9), 0 0 20px -8px var(--specialty-color);
        }

        .specialty-track.hidden-track {
            display: none;
        }

        .specialty-track.slide-out-left {
            transform: translateX(-120%) scale(0.9);
            opacity: 0;
        }
        .specialty-track.slide-out-right {
            transform: translateX(120%) scale(0.9);
            opacity: 0;
        }
        .specialty-track.slide-in-left {
            transform: translateX(0) scale(1);
            opacity: 1;
        }
        .specialty-track.slide-in-right {
            transform: translateX(0) scale(1);
            opacity: 1;
        }

        .track-header {
            padding: 0.9rem 1.1rem 0.75rem;
            text-align: center;
            flex-shrink: 0;
            background: linear-gradient(180deg, rgba(0, 0, 0, 0.02) 0%, transparent 100%);
            border-bottom: 2px solid var(--specialty-color);
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 0.75rem;
            position: relative;
        }

        body.dark .track-header {
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.04) 0%, transparent 100%);
        }

        .track-header .specialty-icon {
            font-size: 1.4rem;
            line-height: 1;
        }

        .track-header h2 {
            color: var(--specialty-color);
            font-weight: 800;
            font-size: 0.98rem;
            letter-spacing: 0.04em;
            margin: 0;
            font-family: 'IBM Plex Sans Arabic', 'Inter', sans-serif;
        }

        .track-header .specialty-count {
            font-size: 0.62rem;
            font-weight: 700;
            color: var(--text-muted-color);
            background: var(--slot-bg);
            padding: 0.15rem 0.65rem;
            border-radius: 1rem;
            border: 1px solid var(--border-subtle);
        }

        .track-navigation {
            display: flex;
            gap: 0.3rem;
            position: absolute;
            left: 0.8rem;
            top: 50%;
            transform: translateY(-50%);
        }

        .track-navigation button {
            background: var(--slot-bg);
            border: 1px solid var(--border-subtle);
            color: var(--text-secondary-color);
            border-radius: 50%;
            width: 28px;
            height: 28px;
            cursor: pointer;
            font-size: 0.75rem;
            transition: 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .track-navigation button:hover {
            background: var(--border-subtle);
            color: var(--text-primary-color);
        }

        .days-list {
            flex: 1;
            overflow-y: auto;
            padding: 0.6rem 0.6rem 1rem;
            scrollbar-width: thin;
            scrollbar-color: var(--border-subtle) transparent;
        }

        .days-list::-webkit-scrollbar {
            width: 4px;
        }
        .days-list::-webkit-scrollbar-track {
            background: transparent;
        }
        .days-list::-webkit-scrollbar-thumb {
            background: var(--border-subtle);
            border-radius: 20px;
        }

        .day-box {
            background: var(--day-box-bg);
            margin-bottom: 0.35rem;
            border-radius: 1rem;
            padding: 0.25rem 0.35rem 0.35rem;
            border: 1px solid var(--day-box-border);
            transition: background 0.15s, border-color 0.15s;
        }

        .day-box:focus-within {
            border-color: var(--specialty-color);
            background: var(--card-hover-background-color);
            box-shadow: 0 0 0 1px var(--specialty-color);
        }

        .day-box.weekend {
            background: var(--day-box-weekend);
            border-left: 3px solid var(--specialty-color);
            border-radius: 1rem 0.35rem 0.35rem 1rem;
        }

        .day-label {
            display: flex;
            justify-content: space-between;
            font-size: 0.62rem;
            font-weight: 700;
            letter-spacing: 0.06em;
            color: var(--text-secondary-color);
            padding: 0.1rem 0.5rem 0.15rem 0.5rem;
            text-transform: uppercase;
        }

        .day-label .day-date {
            font-weight: 800;
            color: var(--text-primary-color);
        }

        .duty-slots {
            display: flex;
            flex-direction: column;
            gap: 0.25rem;
        }

        .duty-slot {
            display: flex;
            align-items: stretch;
            gap: 0.3rem;
            position: relative;
            min-height: 40px;
        }

        .duty-slot .time-display {
            display: flex;
            flex-direction: column;
            gap: 0.05rem;
            font-size: 0.58rem;
            font-weight: 700;
            color: var(--specialty-color, #2563eb);
            min-width: 52px;
            font-family: 'JetBrains Mono', monospace;
            opacity: 0.95;
            flex-shrink: 0;
            text-align: center;
            background: var(--slot-bg);
            padding: 0.2rem 0.25rem;
            border-radius: 0.5rem;
            cursor: pointer;
            transition: 0.2s ease;
            justify-content: center;
            align-items: center;
            border: 1px solid var(--slot-border);
            line-height: 1.3;
        }

        .duty-slot .time-display:hover {
            border-color: var(--specialty-color);
            opacity: 1;
        }

        .duty-slot .time-display.single-slot {
            background: rgba(212, 175, 55, 0.12);
            border-color: rgba(212, 175, 55, 0.25);
            cursor: default;
            opacity: 1;
            color: #b45309;
            min-height: 36px;
            justify-content: center;
            align-items: center;
        }

        body.dark .duty-slot .time-display.single-slot {
            color: #fbbf24;
        }

        .duty-slot .time-display .time-start,
        .duty-slot .time-display .time-end {
            display: block;
            font-size: 0.55rem;
            font-weight: 700;
        }

        .duty-slot .time-display .time-separator {
            opacity: 0.3;
            font-size: 0.45rem;
        }

        .duty-slot .time-display .single-slot-label {
            font-size: 0.72rem;
            font-weight: 800;
            display: block;
            letter-spacing: 0.05em;
        }

        .duty-slot .input-wrapper {
            flex: 1;
            position: relative;
            direction: rtl;
            text-align: right;
            min-width: 0;
            background: var(--slot-bg);
            border: 1px solid var(--slot-border);
            border-radius: var(--input-radius);
            transition: 0.15s ease;
            min-height: 36px;
            display: flex;
            align-items: center;
        }

        .duty-slot .input-wrapper:focus-within {
            border-color: var(--specialty-color);
            box-shadow: 0 0 0 2px rgba(212, 175, 55, 0.15);
        }

        .duty-slot .cell-input,
        .duty-slot .ghost-text {
            width: 100%;
            font-family: 'IBM Plex Sans Arabic', 'Inter', sans-serif;
            font-size: 0.95rem;
            padding: 0.35rem 0.7rem;
            line-height: 1.5;
            text-align: right;
            box-sizing: border-box;
            white-space: pre-wrap;
            word-wrap: break-word;
            margin: 0;
            border: none;
            font-weight: 700;
            border-radius: 0.7rem;
            min-height: 36px;
            height: auto;
        }

        .duty-slot .cell-input {
            background: transparent;
            outline: none;
            color: var(--cell-input-color) !important;
            position: relative;
            z-index: 10;
            direction: rtl;
            caret-color: var(--specialty-color, #2563eb);
            letter-spacing: 0.02em;
        }

        .duty-slot .cell-input::placeholder {
            color: var(--cell-input-placeholder);
            font-weight: 400;
            font-size: 0.85rem;
        }

        .duty-slot .ghost-text {
            position: absolute;
            top: 0;
            right: 0;
            color: var(--ghost-text-color);
            z-index: 5;
            pointer-events: none;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: flex-start;
            direction: rtl;
            background: transparent;
            font-weight: 600;
            padding: 0.35rem 0.7rem;
        }

        .duty-slot .ghost-text .ghost-suggestion {
            color: var(--text-muted-color);
            opacity: 0.6;
        }
        .duty-slot .ghost-text .ghost-suggestion-bright {
            color: var(--text-secondary-color);
            opacity: 0.9;
        }
        .duty-slot .ghost-offset {
            color: transparent;
            visibility: hidden;
            white-space: pre;
        }

        body:not(.dark) .duty-slot .prefilled {
            color: var(--specialty-color, #1e40af) !important;
            font-weight: 800;
            filter: brightness(0.8);
        }
        body.dark .duty-slot .prefilled {
            color: var(--specialty-color) !important;
            font-weight: 700;
        }

        .duty-slot .new-entry {
            color: var(--cell-input-color) !important;
            font-weight: 800;
        }
        .duty-slot .cell-input.invalid-name {
            color: #ef4444 !important;
            border: 1px solid rgba(239, 68, 68, 0.4);
            background: rgba(239, 68, 68, 0.06);
            border-radius: 0.6rem;
        }

        .duty-slot .dropdown-arrow {
            position: absolute;
            left: 4px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 0.5rem;
            color: var(--text-muted-color);
            cursor: pointer;
            z-index: 25;
            padding: 4px 6px;
            border-radius: 2rem;
            transition: 0.15s ease;
            background: rgba(0, 0, 0, 0.05);
            line-height: 1;
        }

        body.dark .duty-slot .dropdown-arrow {
            background: rgba(0, 0, 0, 0.3);
            color: #94a3b8;
        }

        .duty-slot .dropdown-arrow:hover {
            background: rgba(212, 175, 55, 0.15);
            color: #d4af37;
        }

        .duty-slot .custom-menu {
            position: absolute;
            top: calc(100% + 4px);
            right: 0;
            width: 100%;
            max-height: 180px;
            overflow-y: auto;
            background: var(--custom-menu-bg);
            border: 1.5px solid var(--specialty-color, #2563eb);
            border-radius: 0.8rem;
            z-index: 1000;
            display: none;
            box-shadow: var(--popup-shadow);
            backdrop-filter: blur(8px);
            padding: 0.3rem 0;
        }

        .duty-slot .custom-menu div {
            padding: 0.45rem 0.8rem;
            font-size: 0.82rem;
            text-align: right;
            cursor: pointer;
            color: var(--custom-menu-item-color);
            font-weight: 600;
            transition: 0.1s ease;
            border-bottom: 1px solid var(--border-subtle);
        }

            var hospitalName = String(database.hospitalName || 'Iraqi Teaching Hospital').trim() || 'Iraqi Teaching Hospital';
            var hospitalNameElement = document.getElementById('hospital-name');
            if (hospitalNameElement) hospitalNameElement.textContent = hospitalName;

        // ================================================================
        function navigateMonth(delta) {
            var picker = document.getElementById('month-picker');
            if (!picker) return;
            var currentVal = picker.value;
            var targetDate;
            if (currentVal && currentVal.indexOf('-') !== -1) {
                var parts = currentVal.split('-');
                var year = parseInt(parts[0], 10);
                var month = parseInt(parts[1], 10) - 1;
                targetDate = new Date(year, month + delta, 1);
            } else {
                var now = new Date();
                targetDate = new Date(now.getFullYear(), now.getMonth() + delta, 1);
            }
            var y = targetDate.getFullYear();
            var m = String(targetDate.getMonth() + 1).padStart(2, '0');
            picker.value = y + '-' + m;
            onMonthPickerChange();
        }

        function onMonthPickerChange() {
            pendingFocusDate = null;
            pendingFocusSpec = null;
            pendingFocusSlot = null;
            pendingFocusUsed = true;
            if (typeof refreshView === 'function') {
                refreshView();
            }
            var picker = document.getElementById('month-picker');
            if (picker && picker.value) {
                var parts = picker.value.split('-');
                var d = new Date(parseInt(parts[0], 10), parseInt(parts[1], 10) - 1, 1);
                var monthNamesAr = ["يناير", "فبراير", "مارس", "أبريل", "مايو", "يونيو", "يوليو", "أغسطس", "سبتمبر", "أكتوبر", "نوفمبر", "ديسمبر"];
                showToast('عرض جدول: ' + monthNamesAr[d.getMonth()] + ' ' + d.getFullYear(), 'info', 1500);
            }
        }

        function syncSchedulerTheme() {
            var currentTheme = (window.Hub && window.Hub.getTheme) ? window.Hub.getTheme() : (localStorage.getItem('hub_theme') || 'dark');
            if (currentTheme === 'light') {
                document.documentElement.classList.remove('dark');
                document.documentElement.classList.add('light');
                document.body.classList.remove('dark');
                document.body.classList.add('light');
            } else {
                document.documentElement.classList.remove('light');
                document.documentElement.classList.add('dark');
                document.body.classList.remove('light');
                document.body.classList.add('dark');
            }
        }

        // Live theme change listener
        window.addEventListener('hub:theme-changed', function(e) {
            var newTheme = (e.detail && e.detail.theme) ? e.detail.theme : (window.Hub ? window.Hub.getTheme() : 'dark');

                document.documentElement.classList.remove('dark');
                document.documentElement.classList.add('light');
                document.body.classList.remove('dark');
                document.body.classList.add('light');

                document.documentElement.classList.add('dark');
                document.body.classList.remove('light');
                document.body.classList.add('dark');
            }
        });

            if (window.Hub) {
                var activeHosp = window.Hub.getActiveHospital();

                    buildSpecialtyList();
                    updateNameLookup();
                    refreshView();
                }

        });

        // Global keyboard shortcut: Ctrl+S or Cmd+S to save

            if ((e.ctrlKey || e.metaKey) && (e.key === 's' || e.key === 'S')) {
                e.preventDefault();
                saveToGithub();

        });

        window.onload = async function() {
            var now = new Date();
            var nextMonthDate = new Date(now.getFullYear(), now.getMonth() + 1, 1);

            if (picker) {
                picker.value = nextMonthDate.getFullYear() + '-' + String(nextMonthDate.getMonth() + 1).padStart(2, '0');
                picker.onchange = function() {
                    // When month changes, force a full refresh and clear any pending focus
                    pendingFocusDate = null;
                    pendingFocusSpec = null;

            document.querySelectorAll('.time-picker-popup').forEach(function(element) { element.classList.remove('active'); });
            timePickerOpen = false;
        }

        // ================================================================
        // SWIPE SUPPORT
        // ================================================================
        function setupSwipe() {
            var board = document.getElementById('board-container');
            
            board.addEventListener('touchstart', handleTouchStart, { passive: true });
            board.addEventListener('touchmove', handleTouchMove, { passive: true });
            board.addEventListener('touchend', handleTouchEnd, { passive: true });
            
            var isDragging = false;
            var dragStartX = 0;
            
            board.addEventListener('mousedown', function(event) {
                if (currentView !== 'single') return;
                isDragging = true;
                dragStartX = event.clientX;
                board.style.cursor = 'grabbing';
            });
            
            board.addEventListener('mousemove', function(event) {
                if (!isDragging || currentView !== 'single') return;
                var diff = event.clientX - dragStartX;
                if (Math.abs(diff) > 30) {
                    isDragging = false;
                    board.style.cursor = 'default';
                    if (diff > 0) navigateTrack(-1);
                    else navigateTrack(1);
                }
            });
            
            board.addEventListener('mouseup', function() {
                isDragging = false;
                board.style.cursor = 'default';
            });
            
            board.addEventListener('mouseleave', function() {
                isDragging = false;
                board.style.cursor = 'default';
            });
        }

        function handleTouchStart(event) {
            if (currentView !== 'single') return;
            var touch = event.touches[0];
            touchStartX = touch.clientX;
            touchStartY = touch.clientY;
            isSwiping = false;
        }

        function handleTouchMove(event) {
            if (currentView !== 'single' || touchStartX === 0) return;
            var touch = event.touches[0];
            var diffX = touch.clientX - touchStartX;
            var diffY = touch.clientY - touchStartY;
            
            if (Math.abs(diffX) > 10 && Math.abs(diffX) > Math.abs(diffY) * 1.5) {
                isSwiping = true;
                event.preventDefault();
            }
        }

        function handleTouchEnd(event) {
            if (currentView !== 'single' || touchStartX === 0 || !isSwiping) {
                touchStartX = 0;
                touchStartY = 0;
                isSwiping = false;
                return;
            }
            
            var touch = event.changedTouches[0];
            var diffX = touch.clientX - touchStartX;
            
            if (Math.abs(diffX) > 40) {
                if (diffX > 0) navigateTrack(-1);
                else navigateTrack(1);
            }
            
            touchStartX = 0;
            touchStartY = 0;
            isSwiping = false;
        }

        // ================================================================
        // DATA LOADING
        // ================================================================
        async function initialise() {
            var wrapper = document.getElementById('application-wrapper');
            if (wrapper) wrapper.classList.add('loading-active');

            try {
                if (window.Hub) {
                    await window.Hub.loadDatabase();
                    var activeHosp = window.Hub.getActiveHospital();
                    if (activeHosp) {
                        database = activeHosp;
                        database.names = (database.names || []).map(function(item) {
                            if (Array.isArray(item)) return { name: item[0], spec: item[1] || "NS", phone: "" };
                            return item;
                        });
                        applyHospitalName();
                        buildSpecialtyList();
                    }
                }
                updateNameLookup();
                refreshView();
            } catch (error) { console.error("Initialisation Error", error); }

            if (wrapper) wrapper.classList.remove('loading-active');
        }

        // ================================================================
        // SPECIALTY MANAGEMENT
        // ================================================================
        function buildSpecialtyList() {
            specialtyColorMap = {};
            var enabledSpecialties = (database.specialties || []).filter(function(specialty) { return specialty.enabled !== false; });
            
            if (enabledSpecialties.length > 0) {
                enabledSpecialties.forEach(function(specialty) {
                    specialtyColorMap[specialty.id] = specialty.color || '#60a5fa';
                });
                populateSpecialtyQuickSelect();
                specialtyList = enabledSpecialties.map(function(specialty) {
                    return {
                        id: specialty.id,
                        name: specialty.name_en || specialty.name_ar || specialty.id,
                        color: specialty.color || '#60a5fa',
                        name_ar: specialty.name_ar || specialty.id,
                        icon: specialty.icon || '🏥'
                    };
                });
                return;
            }
            specialtyList = [];
            specialtyColorMap = {};
        }

        function updateNameLookup() {
            nameData = {};
            var residents = database.names || [];
            specialtyList.forEach(function(specialty) {
                var specialtyObject = database.specialties?.find(function(specialtyItem) { return specialtyItem.id === specialty.id; });
                var acceptPool = specialtyObject?.acceptPool || [];
                
                if (specialty.id === "OP" || specialty.id === "ICU" || specialty.id === "GA") {
                    nameData[specialty.id] = residents.filter(function(resident) { return resident.spec === "A"; }).map(function(resident) { return resident.name; });
                } else if (specialty.id === "D") {
                    if (acceptPool.length > 0) {
                        nameData[specialty.id] = residents.filter(function(resident) { return acceptPool.includes(resident.spec); }).map(function(resident) { return resident.name; });
                    } else {
                        nameData[specialty.id] = residents.map(function(resident) { return resident.name; });
                    }
                } else {
                    if (acceptPool.length > 0) {
                        nameData[specialty.id] = residents.filter(function(resident) { return acceptPool.includes(resident.spec); }).map(function(resident) { return resident.name; });
                    } else {
                        nameData[specialty.id] = residents.filter(function(resident) { return resident.spec === specialty.id; }).map(function(resident) { return resident.name; });
                    }
                }
            });
        }

        function getSpecialtyColor(specialtyId) {
            return specialtyColorMap[specialtyId] || '#60a5fa';
        }

        // ================================================================
        // VIEW SWITCHING
        // ================================================================
        
        // ================================================================
        // SPECIALTY QUICK SELECTOR FOR SINGLE VIEW
        // ================================================================
        function populateSpecialtyQuickSelect() {

        function updateQuickSelectColor(index) {

                var specColor = getSpecialtyColor(specialtyList[index].id);
                var quickSel = document.querySelector('.specialty-quick-selector');
                if (quickSel) {

        function switchToSpecialtyIndex(index) {
            index = parseInt(index, 10);

            currentTrackIndex = index;
            
            var container = document.getElementById('board-container');

        function switchView(view) {
            if (isTransitioning) return;
            currentView = view;
            document.querySelectorAll('.view-button').forEach(function(button) {
                button.classList.toggle('active', button.dataset.view === view);
            });
            
            var container = document.getElementById('board-container');
            container.classList.remove('all-view', 'single-view');
            container.classList.add(view === 'all' ? 'all-view' : 'single-view');
            
            var quickWrapper = document.getElementById('specialty-quick-selector-wrapper');
            if (quickWrapper) {
                if (view === 'single') {
                    populateSpecialtyQuickSelect();
                    quickWrapper.style.display = 'inline-flex';
                } else {
                    quickWrapper.style.display = 'none';
                }
            }

            var tracks = container.querySelectorAll('.specialty-track');
            if (view === 'all') {
                tracks.forEach(function(track) {
                    track.classList.remove('hidden-track', 'slide-out-left', 'slide-out-right');
                    track.style.display = '';
                });
                document.querySelector('.swipe-hint').style.display = 'none';
            } else {
                tracks.forEach(function(track, index) {
                    if (index === currentTrackIndex) {
                        track.classList.remove('hidden-track', 'slide-out-left', 'slide-out-right');
                        track.style.display = '';
                        track.classList.add('slide-in-left');
                    } else {
                        track.classList.add('hidden-track');
                        track.style.display = 'none';
                    }
                });
                document.querySelector('.swipe-hint').style.display = 'block';
                setTimeout(function() {
                    var visibleTrack = container.querySelector('.specialty-track:not(.hidden-track)');
                    if (visibleTrack) {
                        visibleTrack.scrollIntoView({ behavior: 'smooth', block: 'center' });
                    }
                }, 100);
            }
            updateIndicators();
        }

        function navigateTrack(direction) {
            if (isTransitioning || currentView !== 'single' || specialtyList.length === 0) return;
            
            var totalTracks = specialtyList.length;
            var newIndex = (currentTrackIndex + direction + totalTracks) % totalTracks;
            if (newIndex === currentTrackIndex) return;
            
            isTransitioning = true;
            var container = document.getElementById('board-container');
            var tracks = container.querySelectorAll('.specialty-track');
            var currentTrack = tracks[currentTrackIndex];
            var nextTrack = tracks[newIndex];
            
            if (!currentTrack || !nextTrack) {
                isTransitioning = false;
                return;
            }
            
            nextTrack.classList.remove('hidden-track');
            nextTrack.style.display = '';
            nextTrack.classList.add(direction > 0 ? 'slide-out-right' : 'slide-out-left');
            currentTrack.classList.add(direction > 0 ? 'slide-out-left' : 'slide-out-right');
            
            setTimeout(function() {
                currentTrack.classList.add('hidden-track');
                currentTrack.style.display = 'none';
                currentTrack.classList.remove('slide-out-left', 'slide-out-right');
                nextTrack.classList.remove('slide-out-left', 'slide-out-right');
                nextTrack.classList.add('slide-in-left');
                currentTrackIndex = newIndex;
                updateIndicators();
                setTimeout(function() {
                    nextTrack.classList.remove('slide-in-left');
                    isTransitioning = false;
                }, 300);
            }, 350);
        }

        function updateIndicators() {
            var container = document.getElementById('board-container');
            var existing = container.querySelector('.track-indicators');
            if (existing) existing.remove();
            
            if (currentView !== 'single' || specialtyList.length <= 1) return;
            
            var indicators = document.createElement('div');
            indicators.className = 'track-indicators';
            specialtyList.forEach(function(specialty, index) {
                var dot = document.createElement('span');
                dot.className = 'indicator-dot' + (index === currentTrackIndex ? ' active' : '');
                dot.style.setProperty('--specialty-color', getSpecialtyColor(specialty.id));
                dot.onclick = function() {
                    var diff = index - currentTrackIndex;
                    if (diff !== 0) navigateTrack(diff > 0 ? 1 : -1);
                };
                indicators.appendChild(dot);
            });
            container.appendChild(indicators);
        }

        // ================================================================
        // TIME UTILITIES
        // ================================================================
        var DAY_START = 8;
        var TOTAL_MINUTES = 24 * 60;

        function minutesToTimeString(minutes) {
            var totalMinutes = minutes + (DAY_START * 60);
            var hours = Math.floor(totalMinutes / 60) % 24;
            var mins = totalMinutes % 60;
            var ampm = hours >= 12 ? 'PM' : 'AM';
            var hours12 = hours % 12 || 12;
            return String(hours12).padStart(2, '0') + ':' + String(mins).padStart(2, '0') + ampm;
        }

        function timeStringToMinutes(str) {
            var match = str.match(/(\d{1,2}):(\d{2})\s*(AM|PM)/i);
            if (!match) return null;
            var hours = parseInt(match[1]);
            var mins = parseInt(match[2]);
            var ampm = match[3].toUpperCase();
            if (ampm === 'PM' && hours !== 12) hours += 12;
            if (ampm === 'AM' && hours === 12) hours = 0;
            var total = hours * 60 + mins;
            if (total < DAY_START * 60) total += 24 * 60;
            return total - (DAY_START * 60);
        }

        function formatDutyTime(startMinutes, endMinutes) {
            var endAdjusted = endMinutes;
            if (endMinutes <= startMinutes) {
                endAdjusted = endMinutes + TOTAL_MINUTES;
            }
            return minutesToTimeString(startMinutes) + ' - ' + minutesToTimeString(endAdjusted);
        }

        function parseDutyTime(dutyTimeString) {
            if (!dutyTimeString) return null;
            var parts = dutyTimeString.split(' - ');
            if (parts.length !== 2) return null;
            var start = timeStringToMinutes(parts[0].trim());
            var end = timeStringToMinutes(parts[1].trim());
            if (start === null || end === null) return null;
            return { start: start, end: end };
        }

        // ================================================================
        // REDISTRIBUTION FUNCTIONS
        // ================================================================
        function redistributeDayTimes(date, specialtyCode, editedSlotIndex, useAuto) {
            var entries = (database.schedule || []).filter(function(scheduleEntry) { return scheduleEntry.date === date && scheduleEntry.specCode === specialtyCode; });
            entries.sort(function(a, b) { return (a.dutySlot || 0) - (b.dutySlot || 0); });
            entries.forEach(function(entry, index) { entry.dutySlot = index; });

            var numberOfSlots = entries.length;
            if (numberOfSlots === 0) return { times: [], hasGaps: false, gaps: [] };

            if (numberOfSlots === 1) {
                entries[0].dutyTime = '';
                return { times: [{ start: 0, end: TOTAL_MINUTES }], hasGaps: false, gaps: [] };
            }

            var timeOverrides = {};
            entries.forEach(function(entry, index) {
                if (entry.dutyTime) {
                    var parsed = parseDutyTime(entry.dutyTime);
                    if (parsed) {
                        timeOverrides['slot_' + index] = parsed;
                    }
                }
            });

            var calculatedTimes;

            if (useAuto && editedSlotIndex !== null && editedSlotIndex !== undefined) {
                var editedEntry = entries[editedSlotIndex];
                var editedTime = parseDutyTime(editedEntry.dutyTime);
                
                if (editedTime) {
                    var start = editedTime.start;
                    var end = editedTime.end;
                    if (end <= start) end = end + TOTAL_MINUTES;
                    
                    var slotsBefore = editedSlotIndex;
                    var slotsAfter = numberOfSlots - editedSlotIndex - 1;
                    
                    var timeBefore = start;
                    var timeAfter = TOTAL_MINUTES - end;
                    
                    var results = [];
                    
                    if (slotsBefore > 0) {
                        var durationBefore = timeBefore / slotsBefore;
                        for (var i = 0; i < slotsBefore; i++) {
                            var s = Math.round(i * durationBefore);
                            var e = Math.round((i + 1) * durationBefore);
                            results.push({ start: s, end: e });
                        }
                    }
                    
                    results.push({ start: start, end: end });
                    
                    if (slotsAfter > 0) {
                        var durationAfter = timeAfter / slotsAfter;
                        for (var j = 0; j < slotsAfter; j++) {
                            var s2 = Math.round(end + j * durationAfter);
                            var e2 = Math.round(end + (j + 1) * durationAfter);
                            results.push({ start: s2, end: e2 });
                        }
                    }
                    
                    calculatedTimes = results;
                } else {
                    var slotDuration = TOTAL_MINUTES / numberOfSlots;
                    calculatedTimes = entries.map(function(_, index) {
                        return {
                            start: Math.round(index * slotDuration),
                            end: Math.round((index + 1) * slotDuration)
                        };
                    });
                }
            } else {
                if (Object.keys(timeOverrides).length > 0) {
                    calculatedTimes = calculateSlotTimes(numberOfSlots, timeOverrides);
                } else {
                    var slotDuration2 = TOTAL_MINUTES / numberOfSlots;
                    calculatedTimes = entries.map(function(_, index) {
                        return {
                            start: Math.round(index * slotDuration2),
                            end: Math.round((index + 1) * slotDuration2)
                        };
                    });
                }
            }

            entries.forEach(function(entry, index) {
                var timeData = calculatedTimes[index] || { start: 0, end: TOTAL_MINUTES };
                entry.dutyTime = formatDutyTime(timeData.start, timeData.end);
            });

            var validation = validateSlotTimes(calculatedTimes);
            return { 
                times: calculatedTimes, 
                hasGaps: !validation.valid, 
                gaps: validation.gaps,
                validation: validation
            };
        }

        function calculateSlotTimes(numberOfSlots, customOverrides) {
            customOverrides = customOverrides || {};
            if (numberOfSlots === 0) return [];
            if (numberOfSlots === 1) return [{ start: 0, end: TOTAL_MINUTES }];
            
            var slotDuration = TOTAL_MINUTES / numberOfSlots;
            var results = [];
            
            for (var i = 0; i < numberOfSlots; i++) {
                var start = Math.round(i * slotDuration);
                var end = Math.round((i + 1) * slotDuration);
                var key = 'slot_' + i;
                if (customOverrides[key]) {
                    var custom = customOverrides[key];
                    if (custom.start !== undefined && custom.end !== undefined) {
                        var adjustedEnd = custom.end;
                        if (custom.end <= custom.start) {
                            adjustedEnd = custom.end + TOTAL_MINUTES;
                        }
                        if (custom.start >= 0 && custom.start < TOTAL_MINUTES && adjustedEnd > custom.start) {
                            start = custom.start;
                            end = adjustedEnd;
                        }
                    }
                }
                results.push({ start: start, end: end });
            }
            return results;
        }

        function validateSlotTimes(slots) {
            if (slots.length <= 1) return { valid: true, gaps: [], overlaps: false, messages: [] };

            var gaps = [];
            var overlaps = [];
            var messages = [];
            var TOLERANCE = 2;
            var ordered = slots.slice();

            if (ordered[0].start > TOLERANCE) {
                gaps.push({ start: 0, end: ordered[0].start });
                messages.push('The duty starts late at ' + minutesToTimeString(ordered[0].start) + '.');
            } else if (ordered[0].start < -TOLERANCE) {
                messages.push('The first duty starts before 08:00AM.');
            }

            for (var i = 0; i < ordered.length; i++) {
                if (ordered[i].start < -TOLERANCE || ordered[i].end > TOTAL_MINUTES + TOLERANCE) {
                    messages.push('A resident duty lies outside the 08:00AM to 08:00AM main duty.');
                    break;
                }
                if (ordered[i].end <= ordered[i].start) {
                    messages.push('A resident has an invalid or zero-length duty.');
                    break;
                }
            }

            for (var j = 0; j < ordered.length - 1; j++) {
                var difference = ordered[j + 1].start - ordered[j].end;
                if (difference > TOLERANCE) {
                    gaps.push({ start: ordered[j].end, end: ordered[j + 1].start });
                } else if (difference < -TOLERANCE) {
                    overlaps.push({ start: ordered[j + 1].start, end: ordered[j].end });
                }
            }

            if (gaps.length > 1) {
                messages.push(gaps.length + ' gaps exist between residents.');
            } else if (gaps.length === 1 && messages.length === 0) {
                messages.push('A gap exists between residents.');
            }
            if (overlaps.length > 0) {
                messages.push(overlaps.length + ' resident duties overlap.');
            }

            var lastEnd = ordered[ordered.length - 1].end;
            if (lastEnd < TOTAL_MINUTES - TOLERANCE) {
                gaps.push({ start: lastEnd, end: TOTAL_MINUTES });
                messages.push('The duty ends early at ' + minutesToTimeString(lastEnd) + '.');
            } else if (lastEnd > TOTAL_MINUTES + TOLERANCE) {
                messages.push('The last duty ends after 08:00AM.');
            }

            return {
                valid: gaps.length === 0 && overlaps.length === 0 && messages.length === 0,
                gaps: gaps,
                overlaps: overlaps.length > 0,
                overlapRanges: overlaps,
                messages: messages
            };
        }

        function getDaySlots(date, specialtyCode) {
            var entries = (database.schedule || []).filter(function(scheduleEntry) { return scheduleEntry.date === date && scheduleEntry.specCode === specialtyCode; });
            return entries.map(function(entry, index) {
                var dutyTime = entry.dutyTime || null;
                var timeData = null;
                if (dutyTime) {
                    timeData = parseDutyTime(dutyTime);
                }
                return {
                    index: index,
                    name: entry.name,
                    dutyTime: dutyTime,
                    timeData: timeData,
                    visitCount: entry.VisitCount || 0,
                    raw: entry
                };
            });
        }

        // ================================================================
        // BUILD THE BOARD
        // ================================================================
        function generateBoard() {
            var picker = document.getElementById('month-picker');
            if (!picker) return;
            var parts = picker.value.split('-').map(Number);

            var month = parts[1];

            var board = document.getElementById('board-container');

                var track = document.createElement('div');
                track.className = 'specialty-track';
                track.style.setProperty('--specialty-color', specialtyColor);
                track.dataset.trackIndex = trackIndex;
                
                if (isSingleView && trackIndex !== currentTrackIndex) {
                    track.classList.add('hidden-track');

                }
                
                var totalResidents = nameData[specialty.id]?.length || 0;
                
                var html = `
                    <div class="track-header" style="border-bottom-color: ${specialtyColor};">
                        <span class="specialty-icon">${specialty.icon || '🏥'}</span>
                        <h2 style="color: ${specialtyColor};">${specialty.name_ar || specialty.name}</h2>
                        <span class="specialty-count">${totalResidents} residents</span>
                        ${isSingleView ? `
                            <div class="track-navigation">

                                <button onclick="event.stopPropagation(); navigateTrack(1)">›</button>
                            </div>
                        ` : ''}
                    </div>
                    <div class="days-list">
                `;
                
                for (var dayNumber = 1; dayNumber <= days; dayNumber++) {
                    var dateObject = new Date(year, month - 1, dayNumber);
                    var dayName = new Intl.DateTimeFormat('ar-IQ', { weekday: 'short' }).format(dateObject);
                    var dateFull = String(dayNumber).padStart(2, '0') + '/' + String(month).padStart(2, '0') + '/' + year;
                    var uniqueId = String(dayNumber).padStart(2, '0') + '-' + specialty.id;
                    var isWeekend = (dateObject.getDay() === 5 || dateObject.getDay() === 6);
                    
                    var result = redistributeDayTimes(dateFull, specialty.id, null, isDayAutoRedistributionEnabled(dateFull, specialty.id));
                    var entries = (database.schedule || []).filter(function(scheduleEntry) { return scheduleEntry.date === dateFull && scheduleEntry.specCode === specialty.id; });
                    var numberOfSlots = entries.length;
                    var isSingleSlot = numberOfSlots === 1;
                    var hasGaps = result.hasGaps;
                    var gaps = result.gaps;
                    var timeIssues = result.validation && result.validation.messages ? result.validation.messages : [];
                    
                    html += `
                        <div class="day-box ${isWeekend ? 'weekend' : ''}" style="${isWeekend ? 'border-left-color: ' + specialtyColor + ';' : ''}" data-day="${dateFull}" data-spec="${specialty.id}">
                            <div class="day-label">
                                <span class="day-date">${dateFull.substring(0,5)}</span>
                                <span>${dayName}</span>
                            </div>
                            <div class="duty-slots ${isSingleSlot ? 'single-slot' : ''}" id="slots-${uniqueId}">
                    `;
                    
                    if (numberOfSlots === 0) {
                        html += `
                            <div class="duty-slot" data-slot-index="0">
                                <div class="time-display single-slot" aria-label="24h">
                                    <span class="single-slot-label">24h</span>
                                </div>
                                <div class="input-wrapper" onclick="event.stopPropagation()">

                                    <input type="text" class="cell-input" id="input-${uniqueId}-0"
                                        style="caret-color: ${specialtyColor};"
                                        onfocus="closeAllMenus()"
                                        oninput="handleAutocomplete(this, '${specialty.id}', '${uniqueId}-0')"
                                        onkeydown="handleKeys(event, this, '${uniqueId}-0')"
                                        onblur="handleBlur('${uniqueId}-0')"
                                        data-date="${dateFull}" data-spec="${specialty.id}" data-slot="0" autocomplete="off" placeholder=" ">
                                    <span class="dropdown-arrow" onclick="toggleMenu(event, '${uniqueId}-0', '${specialty.id}')">▼</span>
                                    <div class="custom-menu" id="menu-${uniqueId}-0" style="border-color: ${specialtyColor};"></div>
                                </div>
                                <button class="delete-slot-button" onclick="deleteSlot('${dateFull}', '${specialty.id}', 0)" style="display:none;">✕</button>
                            </div>
                        `;
                    } else {
                        entries.forEach(function(entry, index) {
                            var timeData = result.times && result.times[index] ? result.times[index] : { start: 0, end: TOTAL_MINUTES };
                            var slotUid = uniqueId + '-' + index;
                            var isValidName = nameData[specialty.id]?.includes(entry.name) || false;
                            
                            var isSingle = numberOfSlots === 1;
                            
                            var displayStart = timeData.start;
                            var displayEnd = timeData.end;
                            if (displayEnd <= displayStart) {
                                displayEnd = displayEnd + TOTAL_MINUTES;
                            }
                            
                            var timeDisplayHtml;
                            if (isSingle) {
                                timeDisplayHtml = `
                                    <div class="time-display single-slot" aria-label="24h">
                                        <span class="single-slot-label">24h</span>

                                `;
                            } else {
                                timeDisplayHtml = `
                                    <div class="time-display" onclick="openTimePicker(event, '${dateFull}', '${specialty.id}', ${index})">
                                        <span class="time-start">${minutesToTimeString(displayStart)}</span>
                                        <span class="time-separator">—</span>
                                        <span class="time-end">${minutesToTimeString(displayEnd)}</span>
                                    </div>
                                `;
                            }
                            
                            html += `
                                <div class="duty-slot" data-slot-index="${index}">
                                    ${timeDisplayHtml}
                                    <div class="input-wrapper" onclick="event.stopPropagation()">
                                        <div class="ghost-text" id="ghost-${slotUid}"></div>
                                        <input type="text" class="cell-input ${entry.name && !isValidName ? 'invalid-name' : 'prefilled'}" 
                                            id="input-${slotUid}"
                                            style="caret-color: ${specialtyColor};"
                                            onfocus="closeAllMenus()"
                                            oninput="handleAutocomplete(this, '${specialty.id}', '${slotUid}')"
                                            onkeydown="handleKeys(event, this, '${slotUid}')"
                                            onblur="handleBlur('${slotUid}')"
                                            data-date="${dateFull}" data-spec="${specialty.id}" data-slot="${index}" autocomplete="off" 
                                            value="${entry.name || ''}">
                                        <span class="dropdown-arrow" onclick="toggleMenu(event, '${slotUid}', '${specialty.id}')">▼</span>
                                        <div class="custom-menu" id="menu-${slotUid}" style="border-color: ${specialtyColor};"></div>
                                    </div>
                                    <button class="delete-slot-button" onclick="deleteSlot('${dateFull}', '${specialty.id}', ${index})">✕</button>
                                </div>
                            `;
                        });
                        
                        if (hasGaps) {
                            var gapText = gaps.map(function(gap) { 
                                return minutesToTimeString(gap.start) + ' - ' + minutesToTimeString(gap.end);
                            }).join(', ');
                            var overlapText = result.validation && result.validation.overlapRanges ? result.validation.overlapRanges.map(function(overlap) {
                                return minutesToTimeString(overlap.start) + ' - ' + minutesToTimeString(overlap.end);
                            }).join(', ') : '';
                            var issueText = timeIssues.length > 0 ? timeIssues.join(' ') : ('Gaps: ' + gapText);
                            html += `
                                <div class="slot-tip error" id="tip-${uniqueId}" onclick="promptAutoFixGaps(event, '${dateFull}', '${specialty.id}')" title="Click to fix gaps automatically">
                                    ⚠️ ${issueText} ${gapText ? 'Gaps: ' + gapText + '.' : ''} ${overlapText ? 'Overlap: ' + overlapText + '.' : ''} Click to review a fix.
                                </div>
                            `;
                        } else if (numberOfSlots > 1 && !hasGaps) {
                            html += `
                                <div class="slot-tip success" id="tip-${uniqueId}">

                    html += `
                            </div>
                            <button class="add-slot-button" onclick="addSlot('${dateFull}', '${specialty.id}')">
