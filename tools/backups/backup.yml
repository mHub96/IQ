# Automatic backup of the Hospital Hub data, every 5 hours (and on demand from the Actions tab).
# Needs the repository secret BACKUP_KEY (the same value as the API Worker's BACKUP_KEY secret).
# Each run commits data/ when something changed: the git history keeps every backup.
name: Backup

on:
  schedule:
    - cron: '7 */5 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      API_BASE: https://hosp-hub-api.mrjuniversity.workers.dev
      BACKUP_KEY: ${{ secrets.BACKUP_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Read the data
        run: node backup.mjs
      - name: Commit
        id: commit
        run: |
          git config user.name "hosp-hub-backup"
          git config user.email "hosp-hub-backup@users.noreply.github.com"
          git add data
          if git diff --cached --quiet -- data/records.json; then
            echo "No data changed since the last backup."
            git reset -q
          else
            git commit -q -m "Backup $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push -q
          fi
          echo "ref=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Publish the latest backup to the site
        env:
          REF: ${{ steps.commit.outputs.ref }}
        run: node backup.mjs --publish
